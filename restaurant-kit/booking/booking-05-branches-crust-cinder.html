<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crust &amp; Cinder — Our Pizzerias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--dough:#fff8ef;--crust:#f4e4cc;--tomato:#d7263d;--char:#1b1b1b;--basil:#2f7d4f;--muted:#6f655a;--line:#e8d8bf}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:Archivo,system-ui,sans-serif;background:var(--dough);color:var(--char);line-height:1.5;overflow-x:hidden}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.br{max-width:1220px;margin:0 auto;padding:56px 24px 88px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:3px solid var(--char);padding-bottom:20px;margin-bottom:22px}
.hd small{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--tomato)}
h2{font:400 clamp(36px,5.4vw,66px)/.95 'Archivo Black',sans-serif;margin:8px 0 0;letter-spacing:-.02em;text-transform:uppercase}
.count{font:400 15px 'Archivo Black',sans-serif;display:flex;align-items:center;gap:10px}
.count b{font-size:46px;line-height:1;color:var(--tomato)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.filters span{font-weight:700;font-size:13px;margin-right:4px}
.fl{font:700 13.5px Archivo,sans-serif;border:2px solid var(--char);background:transparent;color:var(--char);border-radius:99px;padding:7px 14px;cursor:pointer}
.fl[aria-pressed="true"]{background:var(--char);color:var(--dough)}
.layout{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:start}
.list{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.bc{width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;transition:border-color .15s,transform .15s}
.bc:hover{border-color:var(--char)}
.bc[aria-pressed="true"]{border-color:var(--tomato);box-shadow:6px 6px 0 var(--tomato);transform:translate(-3px,-3px)}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--crust);font:400 18px 'Archivo Black',sans-serif}
.bc[aria-pressed="true"] .num{background:var(--tomato);color:#fff}
.bc .nm{display:block;margin:0;font:400 19px 'Archivo Black',sans-serif;letter-spacing:-.01em}
.bc .ad{display:block;margin:2px 0 8px;color:var(--muted);font-size:14px}
.feat{display:flex;gap:6px;flex-wrap:wrap}
.feat i{font-style:normal;font-size:12px;font-weight:700;background:var(--dough);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.st{font-size:12.5px;font-weight:700;white-space:nowrap;padding:4px 10px;border-radius:99px;background:#efe7dc;color:var(--muted)}
.st.open{background:#e2f2e8;color:var(--basil)}
.empty{padding:28px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
.side{position:sticky;top:20px;background:var(--char);color:var(--dough);border-radius:22px;overflow:hidden}
.map{position:relative;aspect-ratio:16/11;background:#252322}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:3px solid var(--dough);background:#4a4441;color:var(--dough);font:400 15px 'Archivo Black',sans-serif;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s}
.dot:hover{transform:translate(-50%,-50%) scale(1.1)}
.dot.on{background:var(--tomato);transform:translate(-50%,-50%) scale(1.22);z-index:2}
.dot.off{opacity:.25}
.det{padding:24px 26px 26px}
.det .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.det h3{margin:0;font:400 26px/1.1 'Archivo Black',sans-serif}
.det address{font-style:normal;color:#cfc4b5;margin:6px 0 0;font-size:15px}
.det .st{background:rgba(255,255,255,.08);color:#cfc4b5}
.det .st.open{background:rgba(124,214,158,.15);color:#8fe3ae}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 20px}
.info div{background:rgba(255,255,255,.05);border-radius:12px;padding:11px 14px;font-size:14px}
.info dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a99e90;margin-bottom:2px}
.info dd{margin:0;font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 14.5px Archivo,sans-serif;text-decoration:none;border-radius:12px;padding:12px 16px;border:2px solid var(--dough);color:var(--dough);display:inline-flex;gap:6px;align-items:center}
.btn.red{background:var(--tomato);border-color:var(--tomato);color:#fff}
.btn:hover{background:var(--dough);color:var(--char);border-color:var(--dough)}
.note{margin:24px 0 0;font-size:13.5px;color:var(--muted)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:relative;top:0;order:-1}}
@media (max-width:480px){.br{padding:40px 16px 64px}.bc{grid-template-columns:36px 1fr;padding:16px}.num{width:36px;height:36px;font-size:15px}.bc .st{grid-column:2;justify-self:start}.det{padding:20px 18px}.info{grid-template-columns:1fr}.dot{width:32px;height:32px;font-size:13px}.btn{flex:1 1 auto;justify-content:center}}
@media (prefers-reduced-motion:reduce){.bc,.dot{transition:none}}
</style>
</head>
<body>
<section class="br" aria-labelledby="br-title">
  <div class="hd">
    <div><small>Crust &amp; Cinder · Wood-fired Neapolitan</small><h2 id="br-title">Four ovens,<br>one city.</h2></div>
    <div class="count" aria-live="polite"><b id="cnt">4</b><span id="cnt-l">pizzerias<br>open today</span></div>
  </div>
  <div class="filters" role="group" aria-label="Filter branches">
    <span aria-hidden="true">Show:</span>
    <button class="fl" type="button" data-f="all" aria-pressed="true">All</button>
    <button class="fl" type="button" data-f="now" aria-pressed="false">Open now</button>
    <button class="fl" type="button" data-f="late" aria-pressed="false">Late night</button>
    <button class="fl" type="button" data-f="park" aria-pressed="false">Parking</button>
    <button class="fl" type="button" data-f="kids" aria-pressed="false">Kids' corner</button>
  </div>
  <div class="layout">
    <div><ul class="list" id="list"></ul><p class="empty" id="empty" hidden>No branch matches that filter right now. <button class="fl" type="button" id="reset" style="margin-left:6px">Show all</button></p></div>
    <aside class="side" aria-label="Selected branch">
      <div class="map" id="map" aria-label="Schematic city map with branch markers" role="group">
        <svg viewBox="0 0 640 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="640" height="440" fill="#252322"/>
          <path d="M-10 250 C120 200 200 300 330 260 S520 160 650 210" stroke="#2f4152" stroke-width="44" fill="none"/>
          <g stroke="#3a3533" stroke-width="10" fill="none" stroke-linecap="round"><path d="M0 110H640"/><path d="M0 360H640"/><path d="M150 0V440"/><path d="M420 0V440"/><path d="M40 0L600 440"/></g>
          <circle cx="320" cy="220" r="150" stroke="#3a3533" stroke-width="10" fill="none"/>
          <rect x="460" y="300" width="120" height="70" rx="10" fill="#2c3a2e"/>
          <g font-family="Archivo" font-weight="700" font-size="11" fill="#7b726b" letter-spacing="2"><text x="20" y="236">RIVER ARNE</text><text x="470" y="340">EAST PARK</text><text x="196" y="150">OLD TOWN</text><text x="486" y="140">HARBOURSIDE</text><text x="30" y="390">THE MILLS</text></g>
        </svg>
      </div>
      <div class="det" id="det" aria-live="polite"></div>
    </aside>
  </div>
  <p class="note">All branches: dough rested 48 hours, gluten-free bases on request (prepared in a shared kitchen). Group bookings 12+ at <a href="mailto:hello@example.com">hello@example.com</a>.</p>
</section>
<script>
(function(){
  // hours: [open,close] minutes, Sun-first index; >1440 = after midnight
  var std=[[720,1320],[1020,1320],[1020,1320],[1020,1320],[720,1380],[720,1380],[720,1380]];
  var late=[[720,1380],[1020,1500],[1020,1500],[1020,1500],[1020,1560],[720,1620],[720,1620]];
  var B=[
    {n:'Old Town',a:'22 Bellfounders Lane',area:'Old Town',x:28,y:21,h:std,f:['kids'],seats:64,park:'Street only',ex:'Original oven, est. 2014'},
    {n:'Harbourside',a:'Pier 3, Customs Wharf',area:'Harbourside',x:72,y:18,h:late,f:['late','park'],seats:110,park:'Wharf car park',ex:'Terrace on the water'},
    {n:'The Mills',a:'Unit 5, Weaver Mill Yard',area:'The Mills',x:16,y:76,h:std.map(function(d,i){return i===1?null:d;}),f:['park','kids'],seats:90,park:'60 free spaces',ex:'Pizza school on Saturdays'},
    {n:'East Park',a:'1 Bandstand Row',area:'East Park',x:76,y:63,h:late,f:['late','kids'],seats:48,park:'Street only',ex:'Slice window till 2am'}
  ];
  function $(id){return document.getElementById(id);}
  function fmt(m){m=m%1440;var h=Math.floor(m/60),mm=m%60;return (h%12||12)+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?'am':'pm');}
  var now=new Date(),dw=now.getDay(),cm=now.getHours()*60+now.getMinutes();
  function state(b){
    var t=b.h[dw],y=b.h[(dw+6)%7];
    if(y&&y[1]>1440&&cm<y[1]-1440)return{open:true,txt:'Open · till '+fmt(y[1])};
    if(t&&cm>=t[0]&&cm<t[1])return{open:true,txt:'Open · till '+fmt(t[1])};
    if(t&&cm<t[0])return{open:false,txt:'Opens '+fmt(t[0])};
    return{open:false,txt:t?'Closed now':'Closed today'};
  }
  B.forEach(function(b){b.s=state(b);if(b.s.open)b.f=b.f.concat('now');});
  var openToday=B.filter(function(b){return b.h[dw];}).length;$('cnt').textContent=openToday;
  var LBL={late:'Late night',park:'Parking',kids:"Kids' corner"};
  var sel=0,filter='all',list=$('list'),map=$('map');
  B.forEach(function(b,i){
    var li=document.createElement('li'),bt=document.createElement('button');bt.type='button';bt.className='bc';bt.id='bc'+i;
    bt.innerHTML='<span class="num" aria-hidden="true">'+(i+1)+'</span><span><strong class="nm">'+b.n+'</strong><span class="ad">'+b.a+'</span><span class="feat">'+b.f.filter(function(k){return LBL[k];}).map(function(k){return '<i>'+LBL[k]+'</i>';}).join('')+'</span></span><span class="st'+(b.s.open?' open':'')+'">'+b.s.txt+'</span>';
    bt.addEventListener('click',function(){pick(i);});li.appendChild(bt);list.appendChild(li);
    var d=document.createElement('button');d.type='button';d.className='dot';d.style.left=b.x+'%';d.style.top=b.y+'%';d.textContent=i+1;d.setAttribute('aria-label','Show '+b.n+' branch');
    d.addEventListener('click',function(){pick(i);});map.appendChild(d);b.dot=d;b.li=li;b.bt=bt;
  });
  function pick(i){
    sel=i;var b=B[i];
    B.forEach(function(x,k){x.bt.setAttribute('aria-pressed',k===i);x.dot.classList.toggle('on',k===i);});
    var t=b.h[dw];
    $('det').innerHTML='<div class="row1"><div><h3>'+b.n+'</h3><address>'+b.a+'</address></div><span class="st'+(b.s.open?' open':'')+'">'+b.s.txt+'</span></div>'+
      '<dl class="info"><div><dt>Today</dt><dd>'+(t?fmt(t[0])+' – '+fmt(t[1]):'Closed')+'</dd></div><div><dt>Seats</dt><dd>'+b.seats+' covers</dd></div><div><dt>Parking</dt><dd>'+b.park+'</dd></div><div><dt>Good to know</dt><dd>'+b.ex+'</dd></div></dl>'+
      '<div class="acts"><a class="btn red" href="#book-'+b.n.toLowerCase().replace(/\s+/g,'-')+'">Book here</a><a class="btn" href="tel:01700000000">Call</a><a class="btn" href="https://maps.google.com/?q='+encodeURIComponent(b.a)+'" target="_blank" rel="noopener">Directions <span aria-hidden="true">↗</span></a></div>';
  }
  function apply(){
    var shown=0,first=-1;
    B.forEach(function(b,i){var ok=filter==='all'||b.f.indexOf(filter)>-1;b.li.hidden=!ok;b.dot.classList.toggle('off',!ok);b.dot.tabIndex=ok?0:-1;if(ok){shown++;if(first<0)first=i;}});
    $('empty').hidden=shown>0;
    if(shown&&B[sel].li.hidden)pick(first);
  }
  [].forEach.call(document.querySelectorAll('.filters .fl'),function(f,_,all){
    f.addEventListener('click',function(){filter=f.dataset.f;[].forEach.call(document.querySelectorAll('.filters .fl'),function(x){x.setAttribute('aria-pressed',x===f);});apply();});
  });
  $('reset').addEventListener('click',function(){document.querySelector('.fl[data-f=all]').click();});
  pick(0);apply();
})();
</script>
</body>
</html>
