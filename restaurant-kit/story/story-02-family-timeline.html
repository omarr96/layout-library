<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trattoria Ferrante — Family History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe3;--ink:#2b2118;--muted:#6f5f4e;--terra:#b5532f;--olive:#5d6b3a;--line:#d9c9b0;--card:#fffaf1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Karla,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.story{max-width:1180px;margin:0 auto;padding:64px 28px 96px}
.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:44px}
.top small{font-weight:700;font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--olive)}
h2{font-family:Fraunces,serif;font-weight:500;font-size:clamp(2.2rem,5.5vw,3.8rem);line-height:1.02;letter-spacing:-.02em;margin-top:10px}
h2 em{font-style:italic;font-weight:400;color:var(--terra)}
.gen{font-family:Fraunces,serif;font-style:italic;color:var(--muted);text-align:right;max-width:24ch}
/* track */
.track{position:relative;margin-bottom:36px}
.rail{position:absolute;left:0;top:27px;height:2px;background:var(--line)}
.fill{position:absolute;left:0;top:27px;height:2px;background:var(--terra);width:0;transition:width .5s ease}
[role=tablist]{position:relative;display:flex;justify-content:space-between;gap:8px}
[role=tab]{background:none;border:0;cursor:pointer;font:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 4px;min-width:64px}
[role=tab] .dot{width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:.95rem;transition:all .3s}
[role=tab] .lbl{font-size:.8rem;font-weight:500;text-align:center;line-height:1.3}
[role=tab].done .dot{border-color:var(--terra);color:var(--terra)}
[role=tab][aria-selected=true] .dot{background:var(--terra);border-color:var(--terra);color:#fff;transform:scale(1.08)}
[role=tab][aria-selected=true] .lbl{color:var(--ink);font-weight:700}
[role=tab]:hover .dot{border-color:var(--terra)}
/* panel */
[role=tabpanel]{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;background:var(--card);border:1px solid var(--line);box-shadow:0 18px 40px -26px rgba(60,35,10,.45)}
[role=tabpanel][hidden]{display:none}
.pic{position:relative;min-height:380px;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:in .6s ease}
.pic.old img{filter:sepia(.75) contrast(.95) brightness(1.02)}
.pic.old::after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,250,241,.7);pointer-events:none}
.pic figcaption{position:absolute;left:14px;bottom:14px;background:rgba(43,33,24,.82);color:#f6efe3;font-size:.74rem;padding:5px 10px;letter-spacing:.04em}
.body{padding:44px 44px 40px;display:flex;flex-direction:column;justify-content:center}
.year{font-family:Fraunces,serif;font-size:clamp(3.4rem,8vw,5.6rem);font-weight:700;line-height:.9;color:var(--terra);letter-spacing:-.03em}
.body h3{font-family:Fraunces,serif;font-weight:500;font-size:1.55rem;margin:12px 0 10px;line-height:1.2}
.body p{color:var(--muted);max-width:46ch}
.body .who{margin-top:18px;font-size:.84rem;color:var(--olive);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@keyframes in{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:16px}
.nav button{background:none;border:1px solid var(--ink);color:var(--ink);font:700 .85rem Karla,sans-serif;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.nav button:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.nav button:disabled{opacity:.35;cursor:default}
.count{font-family:Fraunces,serif;font-style:italic;color:var(--muted)}
@media (max-width:820px){.top{grid-template-columns:1fr}.gen{text-align:left}[role=tabpanel]{grid-template-columns:1fr}.pic{min-height:260px}.body{padding:28px 22px 30px}}
@media (max-width:560px){.story{padding:40px 16px 64px}.track{overflow-x:auto;margin:0 -16px 28px;padding:4px 16px 6px;scrollbar-width:none}.track::-webkit-scrollbar{display:none}[role=tablist]{min-width:460px}[role=tab] .dot{width:48px;height:48px;font-size:.85rem}.rail,.fill{top:23px}.nav button span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section class="story" aria-labelledby="fam-h">
  <div class="top">
    <div><small>Our story</small><h2 id="fam-h">Four generations, <em>one sauce pot</em></h2></div>
    <p class="gen">From a six-table room in 1952 to the same street corner today.</p>
  </div>

  <div class="track">
    <div class="rail" aria-hidden="true"></div><div class="fill" aria-hidden="true"></div>
    <div role="tablist" aria-label="Ferrante family timeline"></div>
  </div>

  <div id="panels"></div>

  <div class="nav">
    <button type="button" id="prev" aria-label="Previous chapter"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Earlier</span></button>
    <span class="count" aria-live="polite" id="count"></span>
    <button type="button" id="next" aria-label="Next chapter"><span>Later</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  </div>
</section>
<script>
(function(){
  var U='https://images.unsplash.com/photo-',Q='?w=1200&q=70&auto=format&fit=crop';
  var data=[
    {y:'1952',l:'Six tables',t:'Nonna Pina opens the door',p:'Giuseppina Ferrante borrows two chairs from the church hall and opens a six-table room with a wood oven her husband built from salvaged brick. The menu is whatever she cooked for the family that day.',w:'Giuseppina &ldquo;Pina&rdquo; Ferrante',img:'1574071318508-1cdbab80d002',old:1,c:'The first oven, 1952',a:'A blistered wood-fired pizza with basil'},
    {y:'1968',l:'Full house',t:'The queue reaches the corner',p:'Her son Carlo knocks through to the shop next door. Sunday lunch becomes a neighbourhood ritual, with long shared tables and a ragù that simmers from six in the morning.',w:'Carlo &amp; Teresa Ferrante',img:'1528605248644-14dd04022da1',old:1,c:'Sunday lunch, 1968',a:'A crowded dining room of guests sharing a long meal'},
    {y:'1987',l:'New kitchen',t:'A proper kitchen at last',p:'After a small fire in the old back room, the family rebuilds with a real kitchen and a terrace under the vines. Pina, now in her seventies, still checks every pot of sauce before service.',w:'Carlo Ferrante',img:'1424847651672-bf20a4b0982b',old:1,c:'The terrace opens, 1987',a:'Friends passing plates around a table outdoors'},
    {y:'2009',l:'Third generation',t:'Lucia takes the pass',p:'Granddaughter Lucia returns from cooking school and keeps the recipes untouched &mdash; but adds fresh pasta made by hand every morning and a short list of natural wines.',w:'Lucia Ferrante',img:'1414235077428-338989a2e8c0',c:'Dinner service, 2009',a:'A plated dish on a candlelit restaurant table'},
    {y:'2024',l:'Today',t:'Same corner, same pot',p:'Lucia&rsquo;s son Matteo now runs the floor. The dining room seats sixty, the oven is the original brick, and the ragù pot is the one Nonna Pina bought in 1952.',w:'Lucia &amp; Matteo Ferrante',img:'1590846406792-0adc7f938f1d',c:'The dining room today',a:'A warm modern dining room with pendant lights'}
  ];
  var list=document.querySelector('[role=tablist]'),wrap=document.getElementById('panels'),fill=document.querySelector('.fill'),rail=document.querySelector('.rail'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),cur=0,tabs=[],panels=[];
  data.forEach(function(d,i){
    var b=document.createElement('button');
    b.type='button';b.setAttribute('role','tab');b.id='tab-'+i;b.setAttribute('aria-controls','panel-'+i);
    b.innerHTML='<span class="dot">'+d.y+'</span><span class="lbl">'+d.l+'</span>';
    b.addEventListener('click',function(){go(i,true)});
    list.appendChild(b);tabs.push(b);
    var p=document.createElement('div');
    p.setAttribute('role','tabpanel');p.id='panel-'+i;p.setAttribute('aria-labelledby','tab-'+i);p.tabIndex=0;p.hidden=true;
    p.innerHTML='<figure class="pic'+(d.old?' old':'')+'"><img src="'+U+d.img+Q+'" alt="'+d.a+'" loading="lazy"><figcaption>'+d.c+'</figcaption></figure>'+
      '<div class="body"><span class="year">'+d.y+'</span><h3>'+d.t+'</h3><p>'+d.p+'</p><span class="who">'+d.w+'</span></div>';
    wrap.appendChild(p);panels.push(p);
  });
  function go(i,focus){
    cur=Math.max(0,Math.min(data.length-1,i));
    tabs.forEach(function(t,k){
      var on=k===cur;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;t.classList.toggle('done',k<cur);panels[k].hidden=!on;
    });
    if(focus)tabs[cur].focus();
    var tr=list.parentNode;if(tr.scrollWidth>tr.clientWidth)tr.scrollLeft=tabs[cur].offsetLeft-tr.clientWidth/2+tabs[cur].offsetWidth/2;
    var a=tabs[0],z=tabs[cur],o=list.offsetLeft,l=o+a.offsetLeft+a.offsetWidth/2;
    fill.style.width=(o+z.offsetLeft+z.offsetWidth/2-l)+'px';fill.style.left=l+'px';
    var y=tabs[tabs.length-1];rail.style.left=l+'px';rail.style.width=(o+y.offsetLeft+y.offsetWidth/2-l)+'px';
    prev.disabled=cur===0;next.disabled=cur===data.length-1;
    count.textContent='Chapter '+(cur+1)+' of '+data.length;
  }
  list.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'){go(cur+1,true);e.preventDefault()}
    else if(k==='ArrowLeft'){go(cur-1,true);e.preventDefault()}
    else if(k==='Home'){go(0,true);e.preventDefault()}
    else if(k==='End'){go(data.length-1,true);e.preventDefault()}
  });
  prev.addEventListener('click',function(){go(cur-1)});
  next.addEventListener('click',function(){go(cur+1)});
  window.addEventListener('resize',function(){go(cur)});
  go(0);
})();
</script>
</body>
</html>
