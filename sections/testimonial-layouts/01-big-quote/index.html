<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Quote Testimonial · Lumetric Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1020;
    --panel:#111833;
    --ink:#E8EBF5;
    --muted:#9AA3BF;
    --teal:#5EEAD4;
    --violet:#8B7BFF;
    --line:rgba(232,235,245,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter Tight",system-ui,-apple-system,sans-serif;
    line-height:1.5;min-height:100vh;overflow-x:hidden;
  }
  .t-section{
    position:relative;isolation:isolate;overflow:hidden;min-height:100vh;
    padding:clamp(72px,10vw,140px) 24px clamp(80px,10vw,140px);
  }
  /* soft glow + grid backdrop */
  .t-section::before{
    content:"";position:absolute;inset:0;z-index:-2;
    background:
      radial-gradient(60% 50% at 50% 0%,rgba(139,123,255,.22),transparent 70%),
      radial-gradient(40% 40% at 85% 90%,rgba(94,234,212,.12),transparent 70%);
  }
  .t-section::after{
    content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 80%);
            mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 80%);
  }
  .wrap{max-width:1080px;margin:0 auto;text-align:center}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);
    padding:8px 16px;border:1px solid rgba(94,234,212,.3);border-radius:999px;background:rgba(94,234,212,.06);
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}
  .section-title{
    margin-top:18px;font-size:clamp(16px,1.6vw,18px);font-weight:500;color:var(--muted);
  }
  figure{margin-top:clamp(40px,6vw,64px)}
  .mark{
    display:block;margin:0 auto clamp(14px,2vw,22px);width:clamp(48px,6vw,72px);height:auto;
    color:var(--violet);opacity:.9;
  }
  blockquote{
    font-family:"Instrument Serif",Georgia,serif;font-weight:400;
    font-size:clamp(32px,5.4vw,72px);line-height:1.08;letter-spacing:-.01em;
    color:var(--ink);text-wrap:balance;
  }
  blockquote em{
    font-style:italic;
    background:linear-gradient(90deg,var(--teal),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  figcaption{
    margin-top:clamp(36px,5vw,56px);
    display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,32px);flex-wrap:wrap;
  }
  .person{display:flex;align-items:center;gap:16px;text-align:left}
  .avatar{
    width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--bg);box-shadow:0 0 0 2px var(--teal);
  }
  .name{font-weight:700;font-size:17px;color:#fff;font-style:normal;display:block}
  .role{font-size:14px;color:var(--muted)}
  .divider{width:1px;height:44px;background:var(--line)}
  .logo{
    display:flex;align-items:center;gap:10px;color:#fff;
    font-weight:700;font-size:20px;letter-spacing:-.02em;
  }
  .logo svg{width:28px;height:28px}
  .logo span small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stats{
    margin:clamp(48px,6vw,72px) auto 0;max-width:820px;
    display:grid;grid-template-columns:repeat(3,1fr);
    border:1px solid var(--line);border-radius:20px;background:rgba(17,24,51,.6);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .stat{padding:24px 20px}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat b{display:block;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.03em;color:#fff}
  .stat b i{font-style:normal;color:var(--teal)}
  .stat span{font-size:14px;color:var(--muted)}
  .cta{
    margin-top:36px;display:inline-flex;align-items:center;gap:8px;
    color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;
    border-bottom:1px solid rgba(232,235,245,.35);padding-bottom:3px;transition:color .2s,border-color .2s;
  }
  .cta:hover,.cta:focus-visible{color:var(--teal);border-color:var(--teal)}
  .cta:focus-visible{outline:2px solid var(--teal);outline-offset:6px;border-radius:2px}
  .cta svg{transition:transform .2s}
  .cta:hover svg{transform:translateX(3px)}

  /* entrance */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .reveal.d1{transition-delay:.12s}.reveal.d2{transition-delay:.24s}.reveal.d3{transition-delay:.36s}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

  @media (max-width:640px){
    .divider{display:none}
    figcaption{flex-direction:column;gap:22px}
    .stats{grid-template-columns:1fr}
    .stat + .stat{border-left:0;border-top:1px solid var(--line)}
    .stat{padding:18px}
  }
</style>
</head>
<body>
<section class="t-section" aria-labelledby="t-heading">
  <div class="wrap">
    <p class="eyebrow reveal"><span class="dot" aria-hidden="true"></span>Customer story</p>
    <h2 id="t-heading" class="section-title reveal d1">Why 2,400 data teams moved their dashboards to Lumetric</h2>

    <figure class="reveal d2">
      <svg class="mark" viewBox="0 0 64 48" fill="currentColor" aria-hidden="true"><path d="M0 48V27.6C0 12.1 7.6 2.9 22.8 0l3 6.2C17.6 8.4 13.4 13.1 13 20.4h12V48H0Zm38 0V27.6C38 12.1 45.6 2.9 60.8 0l3 6.2C55.6 8.4 51.4 13.1 51 20.4h12V48H38Z"/></svg>
      <blockquote>
        <p>We used to spend every Monday reconciling three spreadsheets. With Lumetric, our weekly revenue review went from <em>four hours to twenty minutes</em> &mdash; and the numbers finally match.</p>
      </blockquote>
      <figcaption>
        <div class="person">
          <img class="avatar" src="https://images.unsplash.com/photo-1619895862022-09114b41f16f?w=200&h=200&q=70&auto=format&fit=crop&crop=faces" alt="Portrait of Priya Raman" width="64" height="64" loading="lazy">
          <div>
            <cite class="name">Priya Raman</cite>
            <span class="role">VP of Finance &amp; Operations</span>
          </div>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <div class="logo" aria-label="Company: Northwind Freight">
          <svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#8B7BFF"/><path d="M7 20V8l7 7 7-7v12" stroke="#0B1020" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span>Northwind<small>Freight Co.</small></span>
        </div>
      </figcaption>
    </figure>

    <dl class="stats reveal d3">
      <div class="stat"><dt><b>92<i>%</i></b></dt><dd><span>less time on weekly reporting</span></dd></div>
      <div class="stat"><dt><b>14</b></dt><dd><span>data sources unified in one model</span></dd></div>
      <div class="stat"><dt><b>6<i>wk</i></b></dt><dd><span>from kickoff to full rollout</span></dd></div>
    </dl>

    <a class="cta reveal d3" href="#">Read the Northwind case study
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</section>

<script>
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  els.forEach(function (el) { io.observe(el); });
})();
</script>
</body>
</html>
