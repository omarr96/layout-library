<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Slider Testimonials · Halloran &amp; Vey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EFE6;
    --paper:#FBF8F2;
    --ink:#1F1B17;
    --muted:#5E554B;
    --oxblood:#6B1E24;
    --gold:#A8843E;
    --line:#DCD2C2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
  .t-section{padding:clamp(64px,9vw,128px) 20px}
  .wrap{max-width:1040px;margin:0 auto}
  .head{text-align:center;margin-bottom:clamp(36px,5vw,56px)}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--oxblood)}
  .eyebrow::before,.eyebrow::after{content:"";display:inline-block;width:28px;height:1px;background:var(--gold);vertical-align:middle;margin:0 12px}
  h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(34px,4.4vw,52px);line-height:1.1;margin-top:14px}

  .carousel{
    position:relative;background:var(--paper);border:1px solid var(--line);
    padding:clamp(36px,6vw,72px) clamp(20px,7vw,96px) clamp(28px,4vw,40px);
    box-shadow:0 30px 60px -40px rgba(60,40,20,.35);
  }
  .carousel::before{ /* inner rule like letterhead */
    content:"";position:absolute;inset:10px;border:1px solid var(--line);pointer-events:none;
  }
  .seal{
    position:absolute;top:-28px;left:50%;transform:translateX(-50%);
    width:56px;height:56px;border-radius:50%;background:var(--oxblood);color:#F4EFE6;
    display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;
    box-shadow:0 0 0 6px var(--bg);
  }
  .viewport{display:grid;position:relative;touch-action:pan-y}
  .slide{
    grid-area:1/1;text-align:center;opacity:0;visibility:hidden;
    transition:opacity .7s ease,visibility 0s linear .7s;
  }
  .slide.is-active{opacity:1;visibility:visible;transition:opacity .7s ease,visibility 0s}
  .case{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  blockquote{
    margin-top:18px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;
    font-size:clamp(22px,2.9vw,34px);line-height:1.3;color:var(--ink);text-wrap:balance;
  }
  figcaption{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:14px}
  figcaption img{width:56px;height:56px;border-radius:50%;object-fit:cover;filter:grayscale(.25);border:1px solid var(--line)}
  figcaption div{text-align:left}
  cite{display:block;font-style:normal;font-weight:700;font-size:16px}
  figcaption span{font-size:14px;color:var(--muted)}

  .controls{
    margin-top:clamp(28px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;
    position:relative;
  }
  .arrow{
    width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);
    display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s;flex:none;
  }
  .arrow:hover{background:var(--ink);color:var(--paper)}
  .arrow:focus-visible,.dot:focus-visible,.pause:focus-visible{outline:2px solid var(--oxblood);outline-offset:3px}
  .middle{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
  .dots{display:flex;gap:6px}
  .dot{width:28px;height:28px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
  .dot::after{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--oxblood);transition:background .2s,transform .2s}
  .dot[aria-current="true"]::after{background:var(--oxblood);transform:scale(1.2)}
  .progress-row{display:flex;align-items:center;gap:12px;width:100%;max-width:280px}
  .progress{flex:1;height:2px;background:var(--line);overflow:hidden}
  .progress i{display:block;height:100%;width:100%;background:var(--oxblood);transform-origin:left;transform:scaleX(0);transition:transform .05s linear}
  .pause{
    border:0;background:none;cursor:pointer;color:var(--muted);font:600 12px/1 "Source Sans 3",sans-serif;
    letter-spacing:.1em;text-transform:uppercase;padding:6px 4px;display:flex;align-items:center;gap:6px
  }
  .pause svg{width:12px;height:12px}
  .count{font-family:"Cormorant Garamond",serif;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}

  .note{margin-top:22px;text-align:center;font-size:13px;color:var(--muted)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){.slide,.slide.is-active{transition:none}}
  @media (max-width:560px){
    .carousel::before{inset:6px}
    .carousel{padding-top:52px}
    .arrow{width:42px;height:42px}
    .dot{width:24px}
    .controls{display:grid;grid-template-columns:auto 1fr auto;row-gap:14px}
    .middle{display:contents}
    .dots{grid-column:2;grid-row:1;justify-content:center;align-self:center}
    #next{grid-column:3;grid-row:1}
    .progress-row{grid-column:1 / -1;grid-row:2;max-width:none}
    figcaption{flex-direction:column;gap:10px}
    figcaption div{text-align:center}
  }
</style>
</head>
<body>
<section class="t-section" aria-labelledby="t-heading">
  <div class="wrap">
    <header class="head">
      <p class="eyebrow">Client testimonials</p>
      <h2 id="t-heading">Counsel our clients still talk about</h2>
    </header>

    <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="Client testimonials">
      <div class="seal" aria-hidden="true">H&amp;V</div>
      <div class="viewport" id="viewport" aria-live="polite">
        <figure class="slide is-active" role="group" aria-roledescription="slide" aria-label="1 of 5">
          <p class="case">Commercial lease dispute</p>
          <blockquote><p>&ldquo;Our landlord tried to pass a $180,000 HVAC replacement onto us. Margaret read the lease line by line, found the clause they had ignored, and we settled in eleven days without going to court.&rdquo;</p></blockquote>
          <figcaption>
            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=200&h=200&q=70&auto=format&fit=crop&crop=faces" alt="Portrait of Daniel Okafor" width="56" height="56">
            <div><cite>Daniel Okafor</cite><span>Owner, Okafor Print Works &middot; Columbus, OH</span></div>
          </figcaption>
        </figure>
        <figure class="slide" role="group" aria-roledescription="slide" aria-label="2 of 5" aria-hidden="true">
          <p class="case">Estate planning</p>
          <blockquote><p>&ldquo;After my husband passed, I dreaded the paperwork. Thomas explained the trust in plain English over two afternoons, returned every call the same day, and never once made me feel rushed.&rdquo;</p></blockquote>
          <figcaption>
            <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=200&h=200&q=70&auto=format&fit=crop&crop=faces" alt="Portrait of Helen Marsh" width="56" height="56">
            <div><cite>Helen Marsh</cite><span>Retired teacher &middot; Dayton, OH</span></div>
          </figcaption>
        </figure>
        <figure class="slide" role="group" aria-roledescription="slide" aria-label="3 of 5" aria-hidden="true">
          <p class="case">Business acquisition</p>
          <blockquote><p>&ldquo;They caught an unrecorded lien during due diligence that would have cost us the deal. The closing happened on schedule, and the final bill came in under the estimate they gave us in week one.&rdquo;</p></blockquote>
          <figcaption>
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200&h=200&q=70&auto=format&fit=crop&crop=faces" alt="Portrait of Richard Lindqvist" width="56" height="56">
            <div><cite>Richard Lindqvist</cite><span>CEO, Lindqvist Marine Supply</span></div>
          </figcaption>
        </figure>
        <figure class="slide" role="group" aria-roledescription="slide" aria-label="4 of 5" aria-hidden="true">
          <p class="case">Employment law</p>
          <blockquote><p>&ldquo;I walked in with a folder of emails and a lot of anxiety. Amara turned it into a clear timeline, negotiated fourteen months of severance, and kept my reference intact.&rdquo;</p></blockquote>
          <figcaption>
            <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200&h=200&q=70&auto=format&fit=crop&crop=faces" alt="Portrait of Nia Edwards" width="56" height="56">
            <div><cite>Nia Edwards</cite><span>Senior product designer &middot; Cincinnati, OH</span></div>
          </figcaption>
        </figure>
        <figure class="slide" role="group" aria-roledescription="slide" aria-label="5 of 5" aria-hidden="true">
          <p class="case">Real estate closing</p>
          <blockquote><p>&ldquo;First-time buyers, two days before closing, and the title came back clouded. Halloran &amp; Vey cleared it overnight. We got our keys on the Friday, exactly as planned.&rdquo;</p></blockquote>
          <figcaption>
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&h=200&q=70&auto=format&fit=crop&crop=faces" alt="Portrait of Marco Bellini" width="56" height="56">
            <div><cite>Marco Bellini</cite><span>Homeowner &middot; Westerville, OH</span></div>
          </figcaption>
        </figure>
      </div>

      <div class="controls">
        <button class="arrow" id="prev" type="button" aria-label="Previous testimonial" aria-controls="viewport">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 3 5 9l6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="middle">
          <div class="dots" id="dots" role="group" aria-label="Choose testimonial"></div>
          <div class="progress-row">
            <span class="count" id="count" aria-hidden="true">01 / 05</span>
            <div class="progress" aria-hidden="true"><i id="bar"></i></div>
            <button class="pause" id="pause" type="button" aria-pressed="false">
              <svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg>
              <span>Pause</span>
            </button>
          </div>
        </div>
        <button class="arrow" id="next" type="button" aria-label="Next testimonial" aria-controls="viewport">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m7 3 6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <p class="note">Rated 4.9/5 from 310 verified client reviews &middot; Results vary; past outcomes do not guarantee future results.</p>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById('carousel');
  var slides = Array.prototype.slice.call(root.querySelectorAll('.slide'));
  var dotsWrap = document.getElementById('dots');
  var bar = document.getElementById('bar');
  var count = document.getElementById('count');
  var pauseBtn = document.getElementById('pause');
  var viewport = document.getElementById('viewport');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DURATION = 7000;
  var index = 0, elapsed = 0, last = 0;
  var userPaused = reduce, hover = false, focusIn = false;

  var dots = slides.map(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.setAttribute('aria-label', 'Show testimonial ' + (i + 1));
    b.addEventListener('click', function () { go(i); });
    dotsWrap.appendChild(b);
    return b;
  });

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function go(i) {
    index = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) {
      var on = k === index;
      s.classList.toggle('is-active', on);
      if (on) s.removeAttribute('aria-hidden'); else s.setAttribute('aria-hidden', 'true');
    });
    dots.forEach(function (d, k) {
      if (k === index) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
    });
    count.textContent = pad(index + 1) + ' / ' + pad(slides.length);
    elapsed = 0;
    paint();
  }

  function running() { return !userPaused && !hover && !focusIn && !document.hidden; }

  function paint() { bar.style.transform = 'scaleX(' + Math.min(elapsed / DURATION, 1) + ')'; }

  function tick() {
    var t = performance.now();
    if (!last) last = t;
    var dt = Math.min(t - last, 200); last = t;
    if (running()) {
      elapsed += dt;
      if (elapsed >= DURATION) go(index + 1);
      paint();
    }
  }

  function setPaused(p) {
    userPaused = p;
    pauseBtn.setAttribute('aria-pressed', String(p));
    pauseBtn.querySelector('span').textContent = p ? 'Play' : 'Pause';
    pauseBtn.querySelector('svg').innerHTML = p
      ? '<path d="M2 1l9 5-9 5z"/>'
      : '<rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/>';
    // announce slide changes only when the user drives the carousel
    viewport.setAttribute('aria-live', p ? 'polite' : 'off');
  }

  document.getElementById('prev').addEventListener('click', function () { go(index - 1); });
  document.getElementById('next').addEventListener('click', function () { go(index + 1); });
  pauseBtn.addEventListener('click', function () { setPaused(!userPaused); });

  root.addEventListener('mouseenter', function () { hover = true; });
  root.addEventListener('mouseleave', function () { hover = false; });
  root.addEventListener('focusin', function () { focusIn = true; viewport.setAttribute('aria-live', 'polite'); });
  root.addEventListener('focusout', function (e) {
    if (!root.contains(e.relatedTarget)) { focusIn = false; if (!userPaused) viewport.setAttribute('aria-live', 'off'); }
  });
  document.addEventListener('visibilitychange', function () { last = 0; });

  root.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(index - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(index + 1); }
  });

  // swipe
  var sx = 0, sy = 0, tracking = false;
  viewport.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
  }, { passive: true });
  viewport.addEventListener('touchend', function (e) {
    if (!tracking) return; tracking = false;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(index + (dx < 0 ? 1 : -1));
  }, { passive: true });

  setPaused(userPaused);
  go(0);
  setInterval(tick, 50);
})();
</script>
</body>
</html>
