<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Row · Tasklane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;
    --ink:#0F172A;
    --muted:#5B6474;
    --logo:#8A93A3;
    --logo-hover:#334155;
    --accent:#5B5BF0;
    --line:#E3E6EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center}
  .trust{width:100%;padding:96px 24px}
  .wrap{max-width:1180px;margin:0 auto;text-align:center}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--muted);box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .avatars{display:flex}
  .avatars span{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff}
  .avatars span:first-child{margin-left:0;background:#5B5BF0}
  .avatars span:nth-child(2){background:#16A394}
  .avatars span:nth-child(3){background:#F0973C}
  .pill strong{color:var(--ink)}
  .pill>span:last-child{text-align:left;line-height:1.35}
  h2{margin:22px auto 0;max-width:620px;font-size:clamp(24px,3vw,34px);line-height:1.2;font-weight:700;letter-spacing:-.02em}
  h2 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.12em;color:var(--accent)}
  .logos{list-style:none;margin:52px auto 0;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;gap:24px 32px}
  .logos li{display:flex;justify-content:center}
  .logo{display:inline-flex;align-items:center;gap:8px;color:var(--logo);transition:color .25s ease,transform .25s ease;white-space:nowrap}
  .logo:hover{color:var(--logo-hover);transform:translateY(-2px)}
  .logo svg{flex:none}
  .l1{font-weight:800;font-size:19px;letter-spacing:-.03em}
  .l2{font-family:"Instrument Serif",serif;font-size:27px;letter-spacing:-.01em}
  .l2 i{font-style:italic}
  .l3{font-weight:700;font-size:18px;letter-spacing:.01em}
  .l4{font-weight:800;font-size:15px;letter-spacing:.28em}
  .l5{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:17px;letter-spacing:-.02em}
  .l5 b{color:var(--accent);opacity:.55;font-weight:700}
  .l6{font-weight:600;font-size:19px;letter-spacing:-.01em}
  .foot{margin-top:52px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:12px 36px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .foot span{display:inline-flex;align-items:center;gap:8px}
  .foot svg{color:var(--accent)}
  @media (max-width:1024px){
    .logos{grid-template-columns:repeat(3,1fr);gap:36px 24px;max-width:640px}
  }
  @media (max-width:520px){
    .trust{padding:72px 16px}
    .logos{grid-template-columns:repeat(2,1fr);gap:32px 12px;margin-top:40px}
    .l2{font-size:24px}.l1,.l3,.l6{font-size:17px}.l4{font-size:13px;letter-spacing:.22em}.l5{font-size:15px}
    .foot{flex-direction:column;align-items:center}
  }
  @media (prefers-reduced-motion:reduce){.logo{transition:none}.logo:hover{transform:none}}
</style>
</head>
<body>
<section class="trust" aria-labelledby="trust-title">
  <div class="wrap">
    <p class="pill">
      <span class="avatars" aria-hidden="true"><span>M</span><span>J</span><span>R</span></span>
      <span>Trusted by <strong>2,000+ teams</strong> shipping with Tasklane</span>
    </p>
    <h2 id="trust-title">The planning tool behind product teams that <em>actually ship on Fridays</em></h2>

    <ul class="logos" aria-label="Customer logos">
      <li><span class="logo l1" role="img" aria-label="Brightloom">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="currentColor"/><path d="M13 5v16M5 13h16M7.5 7.5l11 11M18.5 7.5l-11 11" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
        <span aria-hidden="true">brightloom</span></span></li>
      <li><span class="logo l2" role="img" aria-label="Quillmark">
        <span aria-hidden="true">Quill<i>mark</i></span></span></li>
      <li><span class="logo l3" role="img" aria-label="Orbelle">
        <svg width="28" height="24" viewBox="0 0 28 24" aria-hidden="true"><circle cx="10" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="12" r="6" fill="currentColor"/></svg>
        <span aria-hidden="true">Orbelle</span></span></li>
      <li><span class="logo l4" role="img" aria-label="Hexafold">
        <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true"><path d="M11 1 21 6.5v11L11 23 1 17.5v-11Z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 1v22M1 6.5l20 11" stroke="currentColor" stroke-width="1.6"/></svg>
        <span aria-hidden="true">HEXAFOLD</span></span></li>
      <li><span class="logo l5" role="img" aria-label="cobaltry">
        <span aria-hidden="true">&gt;cobaltry<b>_</b></span></span></li>
      <li><span class="logo l6" role="img" aria-label="Ferngrid">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="3" fill="currentColor"/><rect x="13" y="1" width="10" height="10" rx="5" fill="currentColor" opacity=".55"/><rect x="1" y="13" width="10" height="10" rx="5" fill="currentColor" opacity=".55"/><rect x="13" y="13" width="10" height="10" rx="3" fill="currentColor"/></svg>
        <span aria-hidden="true">Ferngrid</span></span></li>
    </ul>

    <div class="foot">
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/></svg>SOC 2 Type II certified</span>
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8Z"/></svg>4.8 average from 900+ reviews</span>
      <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Teams onboard in under a day</span>
    </div>
  </div>
</section>
</body>
</html>
