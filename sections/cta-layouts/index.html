<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call To Action Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #111113; --tx: #52525b; --mut: #8a8a93; --line: #e7e7ea; --soft: #f7f7f8; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.6 Inter, system-ui, sans-serif; color: var(--tx); background: #fff; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 56px 28px 80px; }
h1 { margin: 0; font-size: 34px; color: var(--ink); letter-spacing: -.025em; }
.sub { margin: 8px 0 0; max-width: 680px; }
.kit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.kit span { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; margin-top: 40px; }
.card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; transition: box-shadow .25s, transform .25s, border-color .25s; display: flex; flex-direction: column; }
.card:hover { box-shadow: 0 20px 40px -24px rgba(0,0,0,.35); transform: translateY(-3px); border-color: #d4d4d8; }
.shot { position: relative; aspect-ratio: 16/10; overflow: hidden; background: var(--soft); border-bottom: 1px solid var(--line); }
.shot iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
.b { padding: 16px 18px 18px; display: flex; gap: 14px; align-items: flex-start; }
.n { font-size: 13px; font-weight: 700; color: var(--mut); padding-top: 2px; }
.b h3 { margin: 0; font-size: 16px; color: var(--ink); }
.b p { margin: 4px 0 10px; font-size: 13.5px; }
.sw { display: flex; gap: 5px; }
.sw i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
@media (max-width: 600px) { .wrap { padding: 36px 16px 60px; } .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Call to action layouts</h1>
  <p class="sub">Ten call-to-action sections, each a different layout for a different kind of business. Click one to open it full size.</p>
  <div class="kit"><span>Colour band</span><span>Text + photo</span><span>Email signup</span><span>Gradient glow</span><span>Callback</span><span>App download</span><span>Countdown</span><span>Booking</span><span>Donate</span><span>Minimal type</span></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const T = [
  ["01-centered-band", "Shiftly", "Centered colour band · staff-rota app · two buttons", ["#f4f2ff", "#3b2bd6", "#d4f55c", "#140f3d"]],
  ["02-split-image", "Harbour & Finch", "Text + photo card · estate agent · free valuation", ["#f6f1e7", "#1f3a33", "#c09355", "#1b1d1c"]],
  ["03-email-capture", "The Commons Dispatch", "Email signup · newsletter · validation + success", ["#f3ede1", "#1c1a17", "#d9402a", "#5f5d33"]],
  ["04-gradient-glow", "Patchwise", "Dark gradient glow · AI code review · copy install command", ["#07080d", "#8b5cf6", "#22d3ee", "#e9ebf4"]],
  ["05-phone-callback", "Brightwater Plumbing", "Request a callback + 24/7 number · plumber", ["#e7f0f9", "#0f2742", "#ffc629", "#d93a2b"]],
  ["06-app-download", "Fernway", "App download · mobile banking · QR code, text me a link", ["#F4F1EA", "#0B3B3A", "#7FE3C4", "#FF7A59"]],
  ["07-countdown-offer", "Halden & Co", "Countdown offer · home goods sale · copy promo code", ["#FAF7F2", "#141210", "#E8432E", "#FFE9A8"]],
  ["08-booking-cta", "Brightwell Dental", "Book a visit · dental clinic · day and time picks", ["#EAF2FB", "#12324F", "#1F8C83", "#FFFFFF"]],
  ["09-donate-cta", "Wellspring Water Trust", "Donate · water charity · amounts, monthly, Gift Aid", ["#F6EFE4", "#1F4D3A", "#E3A72F", "#B5532E"]],
  ["10-minimal-type", "Østberg Field", "Minimal big type · architecture studio · start a project", ["#EDEBE6", "#151515", "#6F6B63", "#B4441F"]]
];
document.getElementById('grid').innerHTML = T.map(([f, n, d, c], i) => `<a class="card" href="${f}/index.html" target="_blank" rel="noopener">
  <div class="shot"><iframe data-src="${f}/index.html" title="" tabindex="-1" aria-hidden="true" loading="lazy"></iframe></div>
  <div class="b"><span class="n">${String(i + 1).padStart(2, '0')}</span><div><h3>${n}</h3><p>${d}</p><div class="sw">${c.map(x => `<i style="background:${x}"></i>`).join('')}</div></div></div></a>`).join('');
const ro = new ResizeObserver(es => es.forEach(e => e.target.querySelector('iframe').style.transform = `scale(${e.contentRect.width / 1440})`));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const f = e.target.querySelector('iframe'); f.src = f.dataset.src; io.unobserve(e.target); } }), { rootMargin: '200px' });
document.querySelectorAll('.shot').forEach(s => { ro.observe(s); io.observe(s); });
</script>
</body>
</html>
