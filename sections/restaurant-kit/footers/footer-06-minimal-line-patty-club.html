<!doctype html>
<!-- Template hint: Footer: one line with logo, status, links, phone, social and back to top. Learn: minimal when the page above says it all. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="template-hint" content="Footer: one line with logo, status, links, phone, social and back to top. Learn: minimal when the page above says it all.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patty Club — Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--mustard:#ffd23f;--ink:#111;--ketchup:#d62f24;--bun:#fff8e1}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bun);color:var(--ink)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.page-end{min-height:40vh;display:grid;place-items:center;padding:48px 20px;text-align:center}
.page-end p{margin:0;font-size:clamp(22px,3vw,32px);font-weight:700}
.page-end span{display:block;margin-top:8px;font-size:14px;color:#6b6556}

.ft{background:var(--mustard);border-top:3px solid var(--ink)}
.line{max-width:1440px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:22px;font-size:14px;font-weight:500;white-space:nowrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo svg{width:26px;height:26px}
.sep{width:1px;height:18px;background:rgba(17,17,17,.3)}
.status{display:flex;align-items:center;gap:7px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ketchup)}
.status.open i{background:#13853b;box-shadow:0 0 0 3px rgba(19,133,59,.25)}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:18px}
nav a,.tel{text-decoration:none;background:linear-gradient(var(--ink),var(--ink)) 0 100%/0 2px no-repeat;transition:background-size .2s}
nav a:hover,.tel:hover{background-size:100% 2px}
.spacer{flex:1}
.soc{display:flex;gap:6px}
.soc a{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);transition:.2s}
.soc a:hover{background:var(--ink);color:var(--mustard)}
.soc svg{width:14px;height:14px}
.top{font:700 13px 'Space Grotesk';background:var(--ink);color:var(--mustard);border:0;border-radius:99px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.top:hover{background:var(--ketchup);color:#fff}
.copy{color:rgba(17,17,17,.7)}
@media (max-width:1100px){
  .line{flex-wrap:wrap;justify-content:center;white-space:normal;row-gap:12px;text-align:center}
  .spacer{flex-basis:100%;height:0}
  .sep{display:none}
}
@media (max-width:520px){.line{gap:14px 16px;padding:18px 16px}nav ul{gap:14px;flex-wrap:wrap;justify-content:center}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<section class="page-end" id="pagetop" aria-label="End of page">
  <div><p>Two patties. American cheese. No apologies.</p><span>— end of page content —</span></div>
</section>

<footer class="ft">
  <div class="line">
    <a class="logo" href="#" aria-label="Patty Club home"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M3 11a10 8 0 0120 0z" fill="#111"/><rect x="2" y="13" width="22" height="3" rx="1.5" fill="#d62f24"/><path d="M3 18h20a3 3 0 01-3 3H6a3 3 0 01-3-3z" fill="#111"/></svg>Patty Club</a>
    <span class="status" id="st" role="status"><i aria-hidden="true"></i><span>—</span></span>
    <span class="sep" aria-hidden="true"></span>
    <nav aria-label="Footer"><ul><li><a href="#">Menu</a></li><li><a href="#">Order online</a></li><li><a href="#">Locations</a></li><li><a href="#">Jobs</a></li></ul></nav>
    <span class="spacer" aria-hidden="true"></span>
    <a class="tel" href="tel:01700000000">017 00000000</a>
    <span class="soc"><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg></a><a href="#" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 3v12a4 4 0 11-4-4M14 3c1 3 3 5 6 5"/></svg></a></span>
    <span class="copy">© <span id="yr">2026</span> Patty Club</span>
    <button class="top" type="button" id="toTop">Back to top <span aria-hidden="true">↑</span></button>
  </div>
</footer>

<script>
(function(){
  var now=new Date(),d=now.getDay(),m=now.getHours()*60+now.getMinutes();
  var close=(d===5||d===6)?1440:1380,open=690; // 11:30am – 11pm / midnight Fri–Sat
  var st=document.getElementById('st'),t=st.querySelector('span');
  function fmt(x){x=x%1440;var h=Math.floor(x/60),mm=x%60;return (h%12||12)+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?'am':'pm');}
  if(m>=open&&m<close){st.classList.add('open');t.textContent='Grill’s on · till '+(close===1440?'midnight':fmt(close));}
  else t.textContent='Grill’s off · back '+(m<open?'at ':'tomorrow ')+fmt(open);
  document.getElementById('yr').textContent=now.getFullYear();
  document.getElementById('toTop').addEventListener('click',function(){window.scrollTo({top:0});var p=document.getElementById('pagetop');p.setAttribute('tabindex','-1');p.focus({preventScroll:true});});
})();
</script>
</body>
</html>
