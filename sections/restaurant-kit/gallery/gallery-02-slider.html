<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Ledger — Room Slider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6df;--sec:#0f1f1a;--panel:#142a23;--ink:#efe6d2;--muted:#a3b0a6;--accent:#c8a25a;--line:#2b443b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:#1b1b1b;line-height:1.6;overflow-x:hidden;padding-top:48px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.rooms{background:var(--sec);color:var(--ink);padding:96px 0 88px;overflow:hidden}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;align-items:center}
.eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);font-weight:700}
h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.4rem,4.6vw,3.8rem);line-height:1;margin:14px 0 26px}
h2 i{color:var(--accent)}
.idx{font-family:"Cormorant Garamond",serif;font-size:4.5rem;line-height:1;color:var(--accent);display:flex;align-items:baseline;gap:8px}
.idx small{font-size:1.2rem;color:var(--muted)}
.info{border-top:1px solid var(--line);padding-top:22px;margin-top:6px;min-height:170px}
.info h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.7rem;line-height:1.15}
.info p{color:var(--muted);margin-top:8px;font-size:.95rem;max-width:38ch}
.info .tag{display:inline-block;margin-top:14px;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:5px 12px;border-radius:2px}
.ctrls{display:flex;gap:10px;margin-top:28px;align-items:center}
.cb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s,color .2s}
.cb:hover{background:var(--accent);border-color:var(--accent);color:var(--sec)}
.bar{flex:1;height:2px;background:var(--line);margin-left:10px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.bar i.run{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.stage{position:relative;min-width:0}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;padding-right:18%}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:4/3;border-radius:2px;overflow:hidden;margin:0}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s ease,filter .6s}
.slide:not(.on) img{filter:brightness(.45) saturate(.7)}
.slide.on img{transform:scale(1.02)}
.slide figcaption{position:absolute;left:20px;bottom:18px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;background:rgba(15,31,26,.75);padding:6px 12px}
.thumbs{display:flex;gap:10px;margin-top:18px;list-style:none;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.thumbs button{width:84px;height:58px;border:0;padding:0;cursor:pointer;opacity:.45;transition:opacity .25s,outline-color .25s;outline:2px solid transparent;outline-offset:2px;background:none;flex:0 0 auto}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button[aria-current="true"]{opacity:1;outline-color:var(--accent)}
.thumbs button:hover{opacity:.9}
.hours{margin-top:30px;font-size:.85rem;color:var(--muted)}
.hours a{color:var(--accent);text-decoration:none;font-weight:700}
.hours a:hover{text-decoration:underline}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:28px;padding:0 20px}.rooms{padding:64px 0}.idx{font-size:3rem}.info{min-height:0}.track{padding-right:12%}.stage{order:2}.side{display:contents}.top{order:1}.bottom{order:3}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.track{scroll-behavior:auto}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<section class="rooms" aria-labelledby="vl-title" aria-roledescription="carousel">
  <div class="wrap">
    <div class="side">
      <div class="top">
        <p class="eyebrow">The Velvet Ledger · Bar &amp; Grill</p>
        <h2 id="vl-title">Eight rooms, <i>one long night</i></h2>
      </div>
      <div class="bottom">
        <div class="idx" aria-hidden="true"><span id="cur">01</span><small>/ <span id="tot">08</span></small></div>
        <div class="info" aria-live="polite"><h3 id="ti"></h3><p id="de"></p><span class="tag" id="tg"></span></div>
        <div class="ctrls">
          <button class="cb" id="prev" aria-label="Previous room"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="cb" id="next" aria-label="Next room"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          <button class="cb" id="play" aria-label="Pause slideshow" aria-pressed="false"><svg id="ico" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg></button>
          <div class="bar" aria-hidden="true"><i id="bar"></i></div>
        </div>
        <p class="hours">Bar open Wed–Sun, 5pm till late · 22 Ledger Lane, Mill District · <a href="#">Reserve a booth</a></p>
      </div>
    </div>
    <div class="stage">
      <div class="track" id="track" tabindex="0" aria-label="Room photos, use arrow keys">
        <figure class="slide" data-t="The main bar" data-d="Forty feet of oak, back-lit spirits and the best seats for watching the shakers work." data-g="Walk-ins welcome"><img src="https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=1600&q=70&auto=format&fit=crop" alt="Long wooden bar with shelves of bottles under warm lamps"><figcaption>Ground floor</figcaption></figure>
        <figure class="slide" data-t="The amber counter" data-d="Twelve stools facing the grill. Order the dry-aged rib and watch it come off the coals." data-g="Counter seats · 2 max"><img src="https://images.unsplash.com/photo-1572116469696-31de0f17cc34?w=1600&q=70&auto=format&fit=crop" alt="Glowing bar counter with high stools and hanging bulbs" loading="lazy"><figcaption>Grill side</figcaption></figure>
        <figure class="slide" data-t="Edison hall" data-d="Our biggest room, strung with a hundred bulbs. Friday and Saturday it gets loud, in the good way." data-g="Groups up to 30"><img src="https://images.unsplash.com/photo-1543007630-9710e4a00a20?w=1600&q=70&auto=format&fit=crop" alt="Bar hall lit with dozens of filament bulbs" loading="lazy"><figcaption>Back hall</figcaption></figure>
        <figure class="slide" data-t="The low booths" data-d="Curtained booths under the stairs, made for dates and long conversations." data-g="Book ahead"><img src="https://images.unsplash.com/photo-1590846406792-0adc7f938f1d?w=1600&q=70&auto=format&fit=crop" alt="Dark dining room with low lamps and a staircase" loading="lazy"><figcaption>Lower level</figcaption></figure>
        <figure class="slide" data-t="The Ledger Old Fashioned" data-d="Smoked demerara, rye and a single ice block cut in-house every morning." data-g="House signature"><img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=1600&q=70&auto=format&fit=crop" alt="Amber cocktail with a rosemary sprig on a dark bar" loading="lazy"><figcaption>On the menu</figcaption></figure>
        <figure class="slide" data-t="The quiet dining room" data-d="Linen, candlelight and the full grill menu, away from the bar noise." data-g="Dinner from 6pm"><img src="https://images.unsplash.com/photo-1578474846511-04ba529f0b88?w=1600&q=70&auto=format&fit=crop" alt="Moody dining room with set tables and tall curtains" loading="lazy"><figcaption>Dining room</figcaption></figure>
        <figure class="slide" data-t="Pour &amp; stir" data-d="Ask the team for an off-menu serve. Tell them a spirit and a mood; they'll do the rest." data-g="Bartender's choice"><img src="https://images.unsplash.com/photo-1470337458703-46ad1756a187?w=1600&q=70&auto=format&fit=crop" alt="Bartender pouring a drink over a large ice cube" loading="lazy"><figcaption>Behind the bar</figcaption></figure>
        <figure class="slide" data-t="The cellar table" data-d="One table, ten chairs, our private wine list. Perfect for birthdays and board dinners." data-g="Private hire"><img src="https://images.unsplash.com/photo-1536935338788-846bb9981813?w=1600&q=70&auto=format&fit=crop" alt="Dark cocktail garnished with dried citrus on a wooden board" loading="lazy"><figcaption>Downstairs</figcaption></figure>
      </div>
      <ul class="thumbs" id="thumbs" aria-label="Choose a room"></ul>
    </div>
  </div>
</section>
<script>
(function(){
  var track=document.getElementById('track'),slides=[].slice.call(track.children),thumbs=document.getElementById('thumbs');
  var bar=document.getElementById('bar'),play=document.getElementById('play'),ico=document.getElementById('ico');
  var i=0,timer=null,paused=false,hover=false;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function pad(n){return (n<10?'0':'')+n}
  document.getElementById('tot').textContent=pad(slides.length);
  slides.forEach(function(s,k){
    s.setAttribute('aria-roledescription','slide');s.setAttribute('aria-label',(k+1)+' of '+slides.length);
    var li=document.createElement('li'),b=document.createElement('button'),im=document.createElement('img');
    im.src=s.querySelector('img').src.replace('w=1600','w=200');im.alt='';b.appendChild(im);
    b.setAttribute('aria-label','Show '+s.dataset.t.replace('&amp;','&'));
    b.addEventListener('click',function(){go(k,true)});li.appendChild(b);thumbs.appendChild(li);
  });
  var tb=[].slice.call(thumbs.querySelectorAll('button'));
  function paint(){
    var s=slides[i];
    slides.forEach(function(x,k){x.classList.toggle('on',k===i)});
    tb.forEach(function(b,k){b.setAttribute('aria-current',k===i?'true':'false')});
    document.getElementById('cur').textContent=pad(i+1);
    document.getElementById('ti').innerHTML=s.dataset.t;
    document.getElementById('de').textContent=s.dataset.d;
    document.getElementById('tg').textContent=s.dataset.g;
    restart();
  }
  function go(k,user){
    i=(k+slides.length)%slides.length;
    track.scrollTo({left:slides[i].offsetLeft-track.offsetLeft,behavior:reduce?'auto':'smooth'});
    paint();
  }
  function restart(){
    clearTimeout(timer);bar.classList.remove('run');void bar.offsetWidth;
    if(paused||hover||reduce)return;
    bar.classList.add('run');timer=setTimeout(function(){go(i+1)},5000);
  }
  var st;
  track.addEventListener('scroll',function(){
    clearTimeout(st);st=setTimeout(function(){
      var k=Math.round(track.scrollLeft/(slides[0].offsetWidth+18));
      if(k!==i&&k<slides.length){i=k;paint()}
    },120);
  },{passive:true});
  document.getElementById('prev').addEventListener('click',function(){go(i-1,true)});
  document.getElementById('next').addEventListener('click',function(){go(i+1,true)});
  track.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();go(i+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}});
  function setPaused(p){
    paused=p;play.setAttribute('aria-pressed',p?'true':'false');play.setAttribute('aria-label',p?'Play slideshow':'Pause slideshow');
    ico.innerHTML=p?'<path d="M8 5v14l11-7z"/>':'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>';restart();
  }
  play.addEventListener('click',function(){setPaused(!paused)});
  var stage=document.querySelector('.stage');
  stage.addEventListener('mouseenter',function(){hover=true;restart()});
  stage.addEventListener('mouseleave',function(){hover=false;restart()});
  stage.addEventListener('focusin',function(){hover=true;restart()});
  stage.addEventListener('focusout',function(){hover=false;restart()});
  if(reduce)setPaused(true);
  paint();
})();
</script>
</body>
</html>
