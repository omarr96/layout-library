<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osteria Fumo — Inside the Osteria</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9e1;--sec:#f8f3ec;--ink:#2a1f1a;--muted:#7a6a5f;--accent:#b4492c;--line:#e2d6c8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;padding-top:48px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.gal{background:var(--sec);padding:88px 24px 96px}
.wrap{max-width:1240px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:36px}
.eyebrow{font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700}
h2{font-family:Fraunces,serif;font-weight:400;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;margin-top:10px;letter-spacing:-.01em}
h2 em{color:var(--accent)}
.lede{max-width:44ch;color:var(--muted);margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:500 .88rem "DM Sans",sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip span{opacity:.6;margin-left:4px;font-size:.8em}
.grid{columns:3 280px;column-gap:16px}
.tile{break-inside:avoid;margin:0 0 16px;position:relative;display:block;width:100%;border:0;padding:0;background:#ddd;cursor:zoom-in;border-radius:6px;overflow:hidden;text-align:left;color:#fff}
.tile img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(30,18,12,.75));opacity:0;transition:opacity .3s}
.tile .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;font-family:Fraunces,serif;font-style:italic;font-size:1.05rem;transform:translateY(8px);opacity:0;transition:.3s}
.tile .cap small{display:block;font:700 .68rem "DM Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;font-style:normal;opacity:.85}
.tile:hover img,.tile:focus-visible img{transform:scale(1.04)}
.tile:hover::after,.tile:focus-visible::after,.tile:hover .cap,.tile:focus-visible .cap{opacity:1;transform:none}
.tile[hidden]{display:none}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:20px}
.foot a{color:var(--accent);font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(22,14,10,.94);display:none;grid-template-rows:auto 1fr auto;color:#f4ebe1}
.lb.open{display:grid}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:.85rem;letter-spacing:.1em}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:0 72px;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb-cap{text-align:center;padding:16px 20px 24px;font-family:Fraunces,serif;font-style:italic;font-size:1.15rem}
.lb-cap small{display:block;font:500 .78rem "DM Sans",sans-serif;font-style:normal;color:#c9b8a8;margin-top:4px}
.ib{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.ib:hover{background:var(--accent)}
.prev,.next{position:absolute;top:50%;transform:translateY(-50%)}
.prev{left:14px}.next{right:14px}
@media (max-width:640px){.gal{padding:64px 16px 72px}.lb-stage{padding:0 8px}.prev,.next{top:auto;bottom:-60px;transform:none}.prev{left:20px}.next{right:20px}.lb-cap{padding:16px 80px 24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section class="gal" aria-labelledby="gal-title">
  <div class="wrap">
    <div class="head">
      <div>
        <p class="eyebrow">Osteria Fumo · Wood-fire kitchen</p>
        <h2 id="gal-title">Inside the <em>osteria</em></h2>
        <p class="lede">Low ceilings, a forty-year-old oven and a terrace that smells of rosemary. Take a look around before you book.</p>
      </div>
      <div class="chips" role="group" aria-label="Filter photos">
        <button class="chip" aria-pressed="true" data-f="all">All <span></span></button>
        <button class="chip" aria-pressed="false" data-f="room">The room <span></span></button>
        <button class="chip" aria-pressed="false" data-f="kitchen">Kitchen <span></span></button>
        <button class="chip" aria-pressed="false" data-f="plates">Plates <span></span></button>
        <button class="chip" aria-pressed="false" data-f="terrace">Terrace <span></span></button>
      </div>
    </div>

    <div class="grid" id="grid">
      <button class="tile" data-c="room" data-cap="The long room after dark" data-sub="Seats 54 · walk-ins at the bar"><img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&h=1000&q=70&auto=format&fit=crop" width="800" height="1000" alt="Dim dining room with dark wooden tables and pendant lights" loading="lazy"><span class="cap"><small>The room</small>The long room after dark</span></button>
      <button class="tile" data-c="plates" data-cap="Margherita, 90 seconds at 480°C" data-sub="Our oven, our dough, 48-hour proof"><img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=800&h=600&q=70&auto=format&fit=crop" width="800" height="600" alt="Wood-fired pizza with basil and blistered crust" loading="lazy"><span class="cap"><small>Plates</small>Margherita, 90 seconds at 480°C</span></button>
      <button class="tile" data-c="kitchen" data-cap="Chef Dario at the pass" data-sub="Open kitchen · counter seats on request"><img src="https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=800&h=1050&q=70&auto=format&fit=crop" width="800" height="1050" alt="Chef in an apron plating under copper lamps" loading="lazy"><span class="cap"><small>Kitchen</small>Chef Dario at the pass</span></button>
      <button class="tile" data-c="terrace" data-cap="The rosemary terrace" data-sub="Heated from October · dogs welcome"><img src="https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?w=800&h=640&q=70&auto=format&fit=crop" width="800" height="640" alt="Leafy restaurant terrace with string lights and plants" loading="lazy"><span class="cap"><small>Terrace</small>The rosemary terrace</span></button>
      <button class="tile" data-c="plates" data-cap="Spaghetti alle vongole" data-sub="Fresh clams every Tuesday & Friday"><img src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=800&h=900&q=70&auto=format&fit=crop" width="800" height="900" alt="Pan of spaghetti with prawns and cherry tomatoes" loading="lazy"><span class="cap"><small>Plates</small>Spaghetti alle vongole</span></button>
      <button class="tile" data-c="room" data-cap="Window tables at lunch" data-sub="Best light 12–3pm"><img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&h=560&q=70&auto=format&fit=crop" width="800" height="560" alt="Bright restaurant hall with wooden tables and tall windows" loading="lazy"><span class="cap"><small>The room</small>Window tables at lunch</span></button>
      <button class="tile" data-c="kitchen" data-cap="Thirty plates, one line" data-sub="Service starts 6pm sharp"><img src="https://images.unsplash.com/photo-1581349485608-9469926a8e5e?w=800&h=980&q=70&auto=format&fit=crop" width="800" height="980" alt="Cook saucing a row of plates on the pass" loading="lazy"><span class="cap"><small>Kitchen</small>Thirty plates, one line</span></button>
      <button class="tile" data-c="plates" data-cap="Burrata, tomato, torn bread" data-sub="Summer menu"><img src="https://images.unsplash.com/photo-1592417817098-8fd3d9eb14a5?w=800&h=700&q=70&auto=format&fit=crop" width="800" height="700" alt="Salad of tomatoes, mozzarella and basil" loading="lazy"><span class="cap"><small>Plates</small>Burrata, tomato, torn bread</span></button>
      <button class="tile" data-c="terrace" data-cap="Courtyard banquettes" data-sub="Bookable for groups of 8+"><img src="https://images.unsplash.com/photo-1537047902294-62a40c20a6ae?w=800&h=1000&q=70&auto=format&fit=crop" width="800" height="1000" alt="Teal banquette seating surrounded by plants" loading="lazy"><span class="cap"><small>Terrace</small>Courtyard banquettes</span></button>
      <button class="tile" data-c="room" data-cap="A toast at table nine" data-sub="Natural wines by the glass"><img src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=800&h=620&q=70&auto=format&fit=crop" width="800" height="620" alt="Guests raising glasses of red wine" loading="lazy"><span class="cap"><small>The room</small>A toast at table nine</span></button>
      <button class="tile" data-c="plates" data-cap="Pizza for the table" data-sub="Share plates from 4pm"><img src="https://images.unsplash.com/photo-1600628421066-f6bda6a7b976?w=800&h=800&q=70&auto=format&fit=crop" width="800" height="800" alt="Hands reaching for slices of a shared pizza" loading="lazy"><span class="cap"><small>Plates</small>Pizza for the table</span></button>
    </div>

    <div class="foot">
      <span>Via dei Carbonai 14, Old Quarter · Open Tue–Sun from 12pm</span>
      <a href="#">Book the terrace →</a>
    </div>
  </div>
</section>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-top"><span id="lb-count" aria-live="polite">1 / 11</span><button class="ib" id="lb-close" aria-label="Close viewer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="lb-stage">
    <button class="ib prev" id="lb-prev" aria-label="Previous photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img id="lb-img" src="" alt="">
    <button class="ib next" id="lb-next" aria-label="Next photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <p class="lb-cap"><span id="lb-cap"></span><small id="lb-sub"></small></p>
</div>

<script>
(function(){
  var tiles=[].slice.call(document.querySelectorAll('.tile'));
  var chips=[].slice.call(document.querySelectorAll('.chip'));
  chips.forEach(function(c){
    var f=c.dataset.f;
    c.querySelector('span').textContent=f==='all'?tiles.length:tiles.filter(function(t){return t.dataset.c===f}).length;
    c.addEventListener('click',function(){
      chips.forEach(function(x){x.setAttribute('aria-pressed',x===c?'true':'false')});
      tiles.forEach(function(t){t.hidden=!(f==='all'||t.dataset.c===f)});
    });
  });
  var lb=document.getElementById('lb'),img=document.getElementById('lb-img'),cap=document.getElementById('lb-cap'),sub=document.getElementById('lb-sub'),cnt=document.getElementById('lb-count');
  var list=[],i=0,opener=null,sx=null;
  function show(){
    var t=list[i],im=t.querySelector('img');
    img.src=im.src.replace('w=800','w=1600').replace(/h=(\d+)/,function(m,h){return 'h='+h*2});
    img.alt=im.alt;cap.textContent=t.dataset.cap;sub.textContent=t.dataset.sub;cnt.textContent=(i+1)+' / '+list.length;
  }
  function open(t){
    list=tiles.filter(function(x){return !x.hidden});i=list.indexOf(t);opener=t;
    lb.hidden=false;lb.classList.add('open');document.body.style.overflow='hidden';show();document.getElementById('lb-close').focus();
  }
  function close(){lb.classList.remove('open');lb.hidden=true;document.body.style.overflow='';if(opener)opener.focus()}
  function go(d){i=(i+d+list.length)%list.length;show()}
  tiles.forEach(function(t){t.addEventListener('click',function(){open(t)})});
  document.getElementById('lb-close').addEventListener('click',close);
  document.getElementById('lb-prev').addEventListener('click',function(){go(-1)});
  document.getElementById('lb-next').addEventListener('click',function(){go(1)});
  lb.addEventListener('click',function(e){if(e.target===lb||e.target.classList.contains('lb-stage'))close()});
  lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowRight')go(1);
    else if(e.key==='ArrowLeft')go(-1);
    else if(e.key==='Tab'){
      var f=[].slice.call(lb.querySelectorAll('button')),a=document.activeElement,k=f.indexOf(a);
      e.preventDefault();f[(k+(e.shiftKey?-1:1)+f.length)%f.length].focus();
    }
  });
})();
</script>
</body>
</html>
