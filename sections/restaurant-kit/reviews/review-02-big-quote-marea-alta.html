<!doctype html>
<!-- Template hint: Guest reviews: one huge quote beside a photo with highlighted phrases. Learn: a single strong review can carry the section. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="template-hint" content="Guest reviews: one huge quote beside a photo with highlighted phrases. Learn: a single strong review can carry the section.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marea Alta — Guest Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sea:#0f2a33;--deep:#0a1e25;--sand:#efe4d0;--coral:#e07a5f;--mist:#9fb5b9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Jost,system-ui,sans-serif;background:#e9e3d8;color:var(--sand);line-height:1.5;overflow-x:hidden;padding-top:48px}
:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
.q{position:relative;background:var(--sea);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:640px;overflow:hidden}
.photo{position:relative;min-height:320px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,42,51,0) 55%,var(--sea) 100%)}
.cap{position:absolute;left:24px;bottom:22px;z-index:1;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;background:rgba(10,30,37,.72);padding:7px 12px;border-radius:2px}
.body{padding:72px clamp(24px,6vw,96px) 64px clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:center;position:relative}
.mark{font-family:"Cormorant Garamond",serif;font-size:clamp(9rem,18vw,15rem);line-height:.6;color:var(--coral);height:.5em;user-select:none}
.eyebrow{font-size:.78rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--mist);margin-bottom:18px}
blockquote p{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(1.9rem,3.7vw,3.4rem);line-height:1.12;letter-spacing:-.005em}
.hl{background-image:linear-gradient(transparent 62%,rgba(224,122,95,.55) 62%,rgba(224,122,95,.55) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size 1.2s cubic-bezier(.6,.1,.2,1) .4s}
.in .hl{background-size:100% 100%}
.in .hl+.hl{transition-delay:1.1s}
figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin-top:36px;padding-top:26px;border-top:1px solid rgba(239,228,208,.18)}
.who b{display:block;font-weight:500;font-size:1.05rem;letter-spacing:.02em}
.who span{color:var(--mist);font-size:.9rem}
.rating{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--mist)}
.rating .s{color:var(--coral);letter-spacing:2px;font-size:1.05rem}
.cta{margin-left:auto;display:inline-flex;align-items:center;gap:10px;color:var(--sand);text-decoration:none;font-weight:500;border:1px solid rgba(239,228,208,.5);padding:12px 22px;border-radius:999px;transition:background .25s,color .25s,border-color .25s}
.cta:hover{background:var(--sand);color:var(--sea);border-color:var(--sand)}
.wave{position:absolute;right:-40px;bottom:-30px;width:280px;opacity:.08;pointer-events:none}
@media (max-width:860px){
  .q{grid-template-columns:1fr;min-height:0}
  .photo{min-height:260px}
  .photo::after{background:linear-gradient(180deg,rgba(15,42,51,0) 50%,var(--sea) 100%)}
  .body{padding:28px 20px 48px}
  .cta{margin-left:0}
  body{padding-top:24px}
}
@media (prefers-reduced-motion:reduce){.hl{transition:none;background-size:100% 100%}.cta{transition:none}}
</style>
</head>
<body>
<section class="q" aria-labelledby="q-title">
  <div class="photo">
    <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?w=1600&q=70&auto=format&fit=crop" alt="Marea Alta's covered terrace with white tables set above the bay at sunset" loading="lazy" width="1600" height="1067">
    <span class="cap">The terrace, 7:40 pm</span>
  </div>
  <figure class="body" id="fig">
    <h2 class="eyebrow" id="q-title">Marea Alta · Seafood terrace · What guests say</h2>
    <div class="mark" aria-hidden="true">&ldquo;</div>
    <blockquote>
      <p>We ordered the salt-baked sea bream, watched the sun drop into the bay, and <span class="hl">nobody at the table said a word for ten minutes.</span> Then we <span class="hl">booked again before dessert.</span></p>
    </blockquote>
    <figcaption>
      <div class="who"><b>Inês D.</b><span>Anniversary dinner, August 2026</span></div>
      <div class="rating"><span class="s" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span><span>5 / 5 on Google</span></div>
      <a class="cta" href="#book">Book a sunset table <span aria-hidden="true">&rarr;</span></a>
    </figcaption>
    <svg class="wave" viewBox="0 0 200 60" aria-hidden="true"><path d="M0 30 Q25 0 50 30 T100 30 T150 30 T200 30" fill="none" stroke="#efe4d0" stroke-width="6"/><path d="M0 50 Q25 20 50 50 T100 50 T150 50 T200 50" fill="none" stroke="#efe4d0" stroke-width="6"/></svg>
  </figure>
</section>
<div style="height:48px"></div>
<script>
(function(){
  var f=document.getElementById('fig');
  if(!('IntersectionObserver' in window)){f.classList.add('in');return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){f.classList.add('in');io.disconnect();}});},{threshold:.35});
  io.observe(f);
})();
</script>
</body>
</html>
