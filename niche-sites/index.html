<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local, Event &amp; Community Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #111113; --tx: #52525b; --mut: #8a8a93; --line: #e7e7ea; --soft: #f7f7f8; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.6 Inter, system-ui, sans-serif; color: var(--tx); background: #fff; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 56px 28px 80px; }
h1 { margin: 0; font-size: 34px; color: var(--ink); letter-spacing: -.025em; }
.sub { margin: 8px 0 0; max-width: 680px; }
.kit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.kit span { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; margin-top: 40px; }
.card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; transition: box-shadow .25s, transform .25s, border-color .25s; display: flex; flex-direction: column; }
.card:hover { box-shadow: 0 20px 40px -24px rgba(0,0,0,.35); transform: translateY(-3px); border-color: #d4d4d8; }
.shot { position: relative; aspect-ratio: 16/10; overflow: hidden; background: var(--soft); border-bottom: 1px solid var(--line); }
.shot iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
.b { padding: 16px 18px 18px; display: flex; gap: 14px; align-items: flex-start; }
.n { font-size: 13px; font-weight: 700; color: var(--mut); padding-top: 2px; }
.b h3 { margin: 0; font-size: 16px; color: var(--ink); }
.b p { margin: 4px 0 10px; font-size: 13.5px; }
.sw { display: flex; gap: 5px; }
.sw i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
@media (max-width: 600px) { .wrap { padding: 36px 16px 60px; } .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Local, event &amp; community sites</h1>
  <p class="sub">Simple, phone-first sites for local services, events and community groups, in the calm Settle style. 12 of 15 done; added three at a time.</p>
  
  <div class="grid" id="grid"></div>
</div>
<script>
const T = [
  ["01-plumber", "Fairwell Plumbing", "Plumber · 24/7 call & WhatsApp, what to do while we're on the way, services with prices, upfront pricing, service area map, booking form", ["#F4F1EA", "#1A232B", "#A84E1C", "#5D6670"]],
  ["02-electrician", "Marlow Electric", "Electrician · services & guide prices, EV chargers, 24/7 emergency, who turns up, area & hours, quote form", ["#F4F1EA", "#1B1D1F", "#E0A526", "#8A5F05"]],
  ["03-cleaner", "Brightfold", "Home & office cleaning · instant price estimator into booking, what's included by clean type, vetted team, area & hours", ["#F8F5F0", "#24201C", "#B9452B", "#FBE9E2"]],
  ["04-physio", "Linden Physio", "Physiotherapy · what we treat, first visit, physios, booking by concern, practitioner & time slot, prices & insurance, home visits", ["#F1F3F2", "#14202B", "#2B5C8A", "#E3EBF3"]],
  ["05-tutor", "Margin Tutoring", "Tutoring · subjects by grade, how it works with a sample progress note, in-person/online fees, tutors, free trial booking", ["#F6F6F2", "#172033", "#2F4B8F", "#E9EDF6"]],
  ["06-mechanic", "Kettle Lane Garage", "Garage · services with prices, fixed-price servicing by car size, how a visit works, booking by plate & day, open-now hours, map", ["#F2F1EC", "#16191C", "#B4461B", "#596067"]],
  ["07-wedding", "Amara & Jonah", "Wedding · full-photo hero with countdown, our story, the day's timeline & dress code, venue & shuttles, hotels, RSVP with meal choice, registry", ["#F7F3EE", "#2B2421", "#9C5B4E", "#F1E4DC"]],
  ["08-conference", "Common Ground 2027", "Conference · countdown, why attend, speakers, 2-day programme tabs, tickets with early-bird, venue & hotels, partners, registration", ["#F3F5F7", "#121A2B", "#2447B8", "#F3D98B"]],
  ["09-meetup", "Second Thursday", "Monthly meetup · next event ticket with countdown & spots left, who it's for, run of the evening, past events, organisers, code of conduct, RSVP", ["#F4F2F7", "#1E1B2E", "#5A43C8", "#5D5970"]],
  ["10-religious-event", "Eid on the Meadow", "Eid family day · prayer time & place with countdown, programme of the day, site map with sisters' area & lost children point, stalls, attend/volunteer/stall form", ["#FBF7F1", "#22252B", "#B4570D", "#E4EBDD"]],
  ["11-mosque", "Ashgrove Masjid", "Mosque · today's prayer times with next prayer & countdown, Jumu'ah, services, events, women & accessibility, donation pledge by fund, visit us", ["#F4F2ED", "#1C2230", "#2D4E86", "#E9DFCC"]],
  ["12-church", "Ashby Falls Community Church", "Church · Sunday times up front, your first Sunday, kids & youth, groups, filterable events, watch online, food pantry, give, plan-a-visit form", ["#F8F4EE", "#2A2226", "#7A3557", "#F1EAE2"]]
];
document.getElementById('grid').innerHTML = T.map(([f, n, d, c], i) => `<a class="card" href="${f}/index.html" target="_blank" rel="noopener">
  <div class="shot"><iframe data-src="${f}/index.html" title="" tabindex="-1" aria-hidden="true" loading="lazy"></iframe></div>
  <div class="b"><span class="n">${String(i + 1).padStart(2, '0')}</span><div><h3>${n}</h3><p>${d}</p><div class="sw">${c.map(x => `<i style="background:${x}"></i>`).join('')}</div></div></div></a>`).join('');
const ro = new ResizeObserver(es => es.forEach(e => e.target.querySelector('iframe').style.transform = `scale(${e.contentRect.width / 1440})`));
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const f = e.target.querySelector('iframe'); f.src = f.dataset.src; io.unobserve(e.target); } }), { rootMargin: '200px' });
document.querySelectorAll('.shot').forEach(s => { ro.observe(s); io.observe(s); });
</script>
</body>
</html>
