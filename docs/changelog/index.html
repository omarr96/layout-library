  const noneWaiting = !WAITING.items.length;
  if (noneWaiting && state.tag === 'All' && !q) html += `<section class="wait done" id="waiting"><div class="wh"><h2>Not pushed yet</h2><span class="badge ok">${ICON.check}Everything is pushed</span></div><p>${WAITING.note}</p></section>`;
  else if (wItems.length) html += `<section class="wait" id="waiting"><div class="wh"><h2>Not pushed yet</h2><span class="badge amber"><span class="pulse"></span>Waiting for the next push</span></div>
    <p>${WAITING.note}</p><ul class="items">${wItems.map(i => `<li><span class="ix">${ICON[i.icon]}</span><div>${fmt(i.html, true)}<div class="tg">${tagsHTML(i.tags)}</div></div></li>`).join('')}</ul></section>`;
  html += days.map(d => { const list = pushes.filter(p => p.date === d);
    return `<section class="day" id="d-${d}"><h2>${dayName(d)} <span>${list.length} push${list.length > 1 ? 'es' : ''}</span></h2><div class="tl">${list.map(p => `
      <article class="entry ${p.items.length === 1 ? 'small' : ''}" id="c-${p.hash}">
        <div class="meta"><time datetime="${p.date}T${p.time}">${p.time}</time><button class="hash" data-hash="${p.hash}" title="Copy commit hash">${p.hash}${ICON.copy}</button><span class="tg">${tagsHTML(p.tags)}</span></div>
        <h3>${fmt(p.title)}</h3>${p.intro ? `<p class="intro">${fmt(p.intro)}</p>` : ''}<ul>${p.items.map(i => `<li>${fmt(i)}</li>`).join('')}</ul></article>`).join('')}</div></section>`; }).join('');
  if (!wItems.length && !pushes.length) html += `<div class="none">No changes match${state.q ? ` “${esc(state.q)}”` : ''}${state.tag !== 'All' ? ` in ${state.tag}` : ''}.</div>`;
  if (state.tag === 'All' && !q) html += `<div class="first"><span class="hash">${FIRST.hash}</span><span><b>First push</b> · ${dayName(FIRST.date)} · ${FIRST.title}. Everything above came after it.</span></div>`;
  $('#out').innerHTML = html;

  // jump-to menu
  $('#toc').innerHTML = (wItems.length ? `<a href="#waiting" class="wait"><i></i>Not pushed yet<span class="n">${wItems.length}</span></a>` : (noneWaiting && state.tag === 'All' && !q ? `<a href="#waiting" class="clear"><i></i>Not pushed yet<span class="n">0</span></a>` : ''))
    + days.map(d => `<a href="#d-${d}"><i></i>${new Date(d + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}<span class="n">${pushes.filter(p => p.date === d).length}</span></a>`).join('');
  spy();
}
function chips() {
  const count = t => PUSHES.filter(p => p.tags.includes(t)).length + WAITING.items.filter(i => i.tags.includes(t)).length;
  $('#chips').innerHTML = ['All', ...Object.keys(TAGS)].map(t => `<button class="chip ${state.tag === t ? 'on' : ''}" data-tag="${t}">${t === 'All' ? '' : `<i style="background:${TAGS[t]}"></i>`}${t}${t === 'All' ? '' : ` <span style="opacity:.6">${count(t)}</span>`}</button>`).join('');
}
$('#stats').innerHTML = `<div><b>${PUSHES.length}</b>Pushes</div><div><b>${WAITING.items.length}</b>Waiting to push</div><div><b>${PUSHES.reduce((a, p) => a + p.items.length, 0)}</b>Changes</div><div><b>${new Set(PUSHES.map(p => p.date)).size} days</b>Nov 11 to Nov 14</div>`;

/* highlight the current day in the jump-to menu */
let io;
function spy() {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-90px 0px -65% 0px' });
  document.querySelectorAll('#out > section').forEach(s => io.observe(s));
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-tag]'); if (c) { state.tag = c.dataset.tag; chips(); return render(); }
  const h = e.target.closest('[data-hash]'); if (h) { navigator.clipboard?.writeText(h.dataset.hash); return toast(`Copied ${h.dataset.hash}`); }
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
chips(); render();
</script>
</body>
</html>
