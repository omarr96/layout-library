  {"date": "2026-11-16", "time": "18:40", "hash": "3c00a9d", "title": "SEO and Site settings: one home per setting, one dashboard design", "tags": ["SEO", "Dashboard"], "items": ["**Each setting has one home.** Site settings › General: name, icon, logo, language, 404 page and business details. SEO: how the site shows in search and shares.", "**SEO page cleaned up:** no General or Redirects for now (renamed pages still forward by themselves); the \"list this site in search engines\" switch is in Advanced; the AI-crawler switch appears once; X options sit under the X preview.", "**Maintenance has its own place:** one on/off switch; visitors see the site's own maintenance page, or a simple standard one until you design yours with AI.", "**One dashboard look:** SEO and Site settings share a left sub-menu, black buttons and grey selection; content up to 1200px wide; popup rows light up on hover.", "**Nothing is lost:** settings that left a screen keep their saved values, and Site settings now wins for the icon and language when publishing."]},
  {"date": "2026-11-16", "time": "17:05", "hash": "5592ee5", "title": "Merge staging into omarify-sandbox", "tags": ["Maintenance", "Dashboard", "Publishing", "Tests"], "items": ["**Brought in from staging:** customers' own domains (ownership proof by a TXT record, guided setup, hourly checks), Site settings (General, Popups, Header & footer, Cookies) with maintenance mode, the new site overview, and labCheck.", "**Both sides kept where they met:** the live site handles SEO redirects and maintenance mode; the sitemap leaves out the 404 and maintenance pages and what the SEO settings exclude; the site menu has SEO next to Settings.", "**Checked before pushing:** every package type-checks; 1,857 tests pass.", "**Restart the dev server** so the new domain columns are added to the local database."]},
  {"date": "2026-11-16", "time": "16:47", "hash": "967a9c4", "title": "SEO page in the dashboard, scrolled header look, banner photo click", "tags": ["SEO", "Dashboard", "Editor", "Design"], "items": ["**SEO is in the site menu.** All the site-wide SEO settings (overview and score, titles, sharing, sitemap, robots.txt, redirects, structured data, advanced) are on their own page and save straight away.", "**One redirects list.** Redirects from renamed pages now show inside SEO › Redirects; the old Redirects screen forwards there.", "**The editor links to it.** The SEO panel's \"Site SEO ↗\" button opens the SEO page in a new tab, and the SEO icon shows a badge for the open page (red count, amber, or green tick).", "**Headers that change on scroll can be edited.** The Design popup offers Normal / Hover / Scrolled; Scrolled shows the scrolled look on the canvas and saves changes to it only.", "**Imported sites are marked for it.** The explorer notes which class a site's script adds to its header on scroll.", "**Banner photos can be clicked.** A click on a banner's photo selects the photo behind the text layer, with Slide arrows and Replace image; headers and menus are never clicked through."]},
  {"date": "2026-11-16", "time": "14:58", "hash": "4a8ae34", "title": "Edit markers for every site: marquee, carousel, media pairing, explorer", "tags": ["Editor", "Media", "AI"], "items": ["Every imported or AI-built site now labels its moving and media parts (tabs, sliders, marquees, play buttons, download links) so the editor knows exactly what they are.", "Marquee: its items can be changed from the toolbar (Item 1 of N), and edits are copied to the repeated copies automatically.", "Carousels step card by card with the arrows; a projects slider shows each project by name.", "Play buttons open the right player: \"Watch\" never offers to replace audio, \"Listen\" never offers to replace video.", "Download buttons say \"Change file\" (or \"Choose file\" when none is attached yet), never \"Change audio\".", "Anything hidden on a page (toasts, captions, \"no results\" lines) now has a Show / Hide so it can be edited.", "New explorer: when a site is imported or changed by AI, its pages are run in a hidden browser, every button is pressed, and what really plays, opens or switches is labelled. Checked on 13 sites with no false findings.", "Sites that already use `data-state` for their own code get `data-zj-*` labels instead, so nothing on the site breaks."]},
  {"date": "2026-11-16", "time": "12:10", "hash": "464fe88", "title": "Release QA: polish", "tags": ["Fixes", "Editor", "Dashboard"], "items": ["**The editor says Live or Draft correctly**, like the dashboard.", "**Browser tabs have real titles** (\"Billing · Zejify\", \"Home · Bakery · Zejify\").", "**Sites are listed by last edit.**", "**New site addresses end at a whole word**, not cut in the middle.", "**Replacing an image keeps the page's description (alt text).**", "**Small wording fixes:** \"You\" on Members, \"$0 a month\" and \"1,000 GB\" on Billing."]},
  {"date": "2026-11-16", "time": "11:48", "hash": "59ad216", "title": "Release QA: the second round of fixes", "tags": ["Fixes", "Editor", "Design"], "items": ["**The editor works on phones and tablets:** page menu at the top, tools along the bottom.", "**The Design popup behaves:** Gradient applies at once, the image picker is always on top.", "**Clearer menus:** fonts and sizes show real names, and the current one is ticked.", "**Saving is steadier:** no doubled edits, \"Don't save\" really doesn't save, kept changes never overwrite newer work, and toast Undo buttons undo only their own change.", "**Better checks:** business email and phone, design-system values, hidden home page.", "**Dark colours show for visitors whose phone is set to dark, and Preview tells you when it can't show your latest changes.**"]},
  {"date": "2026-11-16", "time": "11:21", "hash": "6aeafe8", "title": "Release QA: the serious problems fixed", "tags": ["Fixes", "Editor", "AI"], "items": ["**Delete can't wipe the page any more.** Pressing Delete twice used to remove everything between header and footer; now the page's main parts can't be deleted and the next section is selected.", "**Escape keeps what you typed.**", "**The Design popup fits on screen**, so its Reset and Done buttons are always reachable.", "**Token use is for platform admins only** (it showed every workspace's numbers to everyone).", "**Changes across several pages undo together** (header & footer, design system, History restore).", "**Saving is safer:** a conflict on one page no longer blocks the next, and a reload never wipes an edit you just made.", "**AI has a fair-use limit per person**, so nobody can run it in a loop.", "**Publish stays visible on smaller laptops; the toolbar fits on a phone.**"]},
  {"date": "2026-11-15", "time": "22:34", "hash": "27215e4", "title": "Add section works in the AI chat again", "tags": ["AI", "Editor"], "items": ["**Picking a section idea opens the AI chat**, like before: you see your request, each step while the section is designed, and an answer with Show me and Undo. It still uses the new section designer."]},
  {"date": "2026-11-15", "time": "22:08", "hash": "44ec466", "title": "The new SEO system", "tags": ["SEO", "AI", "Publishing"], "items": ["**A new SEO panel for each page.** A score with five categories, the top 3 things to fix, a Google preview, title and description with live counters, alt text, share previews and more. AI suggests titles, descriptions, alt text and topics; nothing changes until you pick one.", "**Site SEO.** One place for site-wide settings: title template, share image, sitemap, robots.txt, redirects, business details for search engines, verification tags. Saved in a new `seo.json` file.", "**Publishing does the SEO work.** Each page gets its search and share tags, plus a sitemap, robots.txt and business details for Google. Changing a page's address now redirects the old one.", "**Fix all with AI.** AI writes better titles, descriptions and alt text for one page or the whole site; you review every change and apply what you want, with one undo."]},
  {"date": "2026-11-15", "time": "18:47", "hash": "cf7d99c", "title": "Add section designs like Opus on Sonnet", "tags": ["AI", "Design"], "items": ["**New sections are designed by their own step.** Picking an idea in Add section, or typing \"add a pricing section\" in the chat, now uses a recipe for that kind of section plus the site's own design, then checks and reviews the result before adding it. Sections come out with a real layout, not a plain row of cards.", "**About 15-25 seconds per section**, with a time limit so it never hangs; one undo takes it out."]},
  {"date": "2026-11-15", "time": "17:24", "hash": "e64caa5", "title": "Google fonts, safer deleting, simpler Pages", "tags": ["Design", "Editor", "AI"], "items": ["**Add any Google font in the Design system.** Type its name, pick its kind (serif, sans-serif…), and untick weights you don't need; it is loaded on every page and ready to pick.", "**Deleting a colour, font or size warns first.** It says how many places use it and lets you replace them with another one, or just delete it.", "**Pages left the left menu.** Switch pages from the address bar. The Pages panel no longer has Navigation or Coming soon.", "**A hidden preloader stays hidden** after page changes in the editor.", "**The editor's AI agent now runs on Sonnet 5.5.**"]},
  {"date": "2026-11-15", "time": "16:39", "hash": "26f0f2f", "title": "Import fixes from the STATIC studio design", "tags": ["Publishing", "Fixes"], "items": ["**Loading screens no longer hide the page from the import check.** The check now hides a preloader and shows the page as it is after loading before it measures, so contrast and layout problems behind a loader are found.", "**Dark-only designs get no dark-mode warning** (there is no second look to send).", "**A variable a script sets** (like the menu's `--mx`) is no longer reported as \"not defined\".", "**A placeholder phone or email is warned about every time**, also on a resend.", "**A reply with several pages gives each page's preview link.**"]},
  {"date": "2026-11-15", "time": "16:33", "hash": "a8e49b2", "title": "Preview follows Light/Dark, preloaders no longer block the editor", "tags": ["Editor", "Design", "Publishing"], "items": ["**Preview shows the look you are editing.** It opens in Light or Dark, whichever the editor's switch is on, and changes when you switch. Before, it could show the other look, so colours looked \"old\".", "**Publishing shows at once.** Live pages are checked fresh on every visit, so a change no longer waits up to a minute to appear.", "**Sites with a loading screen open in the editor.** A preloader (a 1-100% count, boot lines, a progress bar) is hidden on the editing canvas only, and the page is shown as it is after loading, so you can click, edit and scroll. Preview and the live site still play it. Menus and pop-ups are never mistaken for a loader.", "**Full-screen menus open in the editor** the way the page opens them (tested on the STATIC studio design, which imported at a 100% match).", "**The reload button next to the address works in Preview.** It crashed there before; now it loads the page again, which replays its intro."]},
  { date: "2026-11-15", time: "14:25", hash: "8b4a030", title: "Dark and light mode, Replace audio/video, import fixes", tags: ["Design", "Editor", "Media", "Fixes"], items: [
    "**Sites with a dark and light look keep both.** When a design comes with a dark mode, it's kept as the designer made it, the site's own mode button keeps working, and the checks look at both looks. Tested on the gaming lounge and Lumen: about 99.5% the same as the original in both looks.",
    "**The editor has a Light / Dark switch** for those sites. The page, the design system colours and the colour swatches show the look you pick.",
    "**Colours stay in the look you set them in.** A text or background colour picked in Dark changes Dark only, and one picked in Light changes Light only. Text, sizes, spacing, fonts and images are the same in both.",
    "**Play icons offer Replace audio or Replace video**, also on music players whose sound is made in code. Other Replace buttons now say what they replace (image, icon, video, audio).",
    "**Fixes from the creative and small-shop test designs:** tab panes that should be hidden stay hidden, image and file links are kept, a cut-off download says so and is tried once more, and hard-to-read colour warnings are grouped per look.",
    "**Smooth size changes are allowed.** Animating width, height, margin, padding or font size is now a warning, not an error, so things like growing slider dots keep working."] },
  { date: "2026-11-14", time: "19:01", hash: "b68c3af", title: "Imported designs at 99%, keep designer colours, Replace file", tags: ["Publishing", "Design", "Editor", "Media"], items: [
    "**Imported designs now come out about 99% the same as the original.** The 10 test designs match 99.3% on desktop and 96.7% on phone (99.4% without one quirk of the comparison). Before, they were at 87.9% and 81.1%.",
    "**Designers' colours are kept.** When the AI converts a finished design someone brought, colours that are hard to read become warnings that name the texts and the colours that would work. They no longer stop the save, and the AI is told never to darken a design itself.",
    "**Fewer wrong \"hard to read\" refusals.** Transparent headers, screen-reader-only text, outlined text, gradient text, icons beside words, and slideshows were all measured wrongly before.",
    "**Better advice.** White text on a photo now gets \"darken the photo\", not a light overlay. Every refusal names the colours that pass.",
    "**Every problem is listed.** The list used to stop at 40. Two false warnings are fixed: transitions with `cubic-bezier(…)`, and animations whose duration is a variable.",
    "**Hidden tabs stay hidden.** Imported pages showed all of their tabs at once; the server now fixes this.",
    "**Replace file in Media.** Upload a new menu PDF and every page that linked the old one uses the new one. File links in the editor get a **Change file** button.",
    "**The Code button is gone from the editor**; code is edited from the Files panel. The \"Save your changes?\" and \"Restore your unsaved changes?\" cards have a new design."] },
  { date: '2026-11-14', time: '17:40', hash: 'a388bcd', title: 'More icons, Create icon with AI, new save popup', tags: ['Editor', 'AI'], items: [
    '**About 2,100 more icons in Change icon.** You can search by name or meaning ("phone", "tooth", "delivery"); 60 common business icons show before you type.',
    '**Create icon with AI.** Describe the icon and the AI draws three versions to choose from. Only safe drawing shapes are kept.',
    '**Change icon works on any small icon now**, not only icons from the site\'s own icon set. A new icon takes the colour of the text around it, and one undo puts the old one back.',
    '**New "Save your changes?" popup.** A cleaner card: "Don\'t save" on the left, Cancel and Save on the right. Esc or a click outside closes it.'] },
  { date: '2026-11-14', time: '17:12', hash: '7d01a0c', title: 'Video, audio and files into Media; change them in the editor', tags: ['Media', 'Editor', 'Publishing'], items: [
    '**Videos are no longer removed.** When a customer\'s AI sends a site, its videos and audio are saved in the site\'s Media, the same way images are.',
    '**Files to download are saved too.** Links to PDF, ZIP, Word, Excel and PowerPoint files go into Media. If one can\'t be downloaded, the link stays as it was and the AI gets a warning, not a refusal.',
    '**Media takes the new file types.** You can upload ZIP, Word, Excel and PowerPoint files, and they have a "Files" tab in the picker. OGG and WAV audio uploads work now too.',
    '**Videos play everywhere.** They play in the preview link and on live sites, Safari included.',
    '**Audio and video can be changed in the editor.** A click on a player now selects it instead of playing it. A video has Replace video, Poster and Size; audio has Replace audio.',
    '**A link can point to a file from Media.** The Link box has "A file from Media (PDF, ZIP, Word, Excel…)".'] },
  { date: '2026-11-14', time: '15:09', hash: '86bcb43', title: 'Fixes from a customer-style test site, gradient caret, Change icon', tags: ['Fixes', 'AI', 'Editor', 'Publishing'], intro: 'Found by building a test site (Mitali\'s Kitchen) the way a customer\'s AI would, and fixed:', items: [
    '**No more wrong contrast refusals for buttons over photos.** Text on a solid button laid over a photo is measured against the button, not the photo\'s corners.',
    '**The customer\'s own phone or email can be confirmed mid-change.** `zejify_submit_task` takes `facts`, a repeated `zejify_start_change` keeps them, and the refusal says how.',
    '**"Plan full" comes first, and never suggests deleting a site.** The guide warns before the AI writes anything; a new site is refused before the checks.',
    '**Headings split one letter per span are caught** even when their spaces are written `&nbsp;`.',
    '**Library versions match.** A plugin is pinned to the version of its core already on the page (GSAP ScrollTrigger next to GSAP 3.12.5), not the newest.',
    '**Content that fades in on load can be clicked in the editor**, and the coverage check no longer calls it hidden. A photo laid under content is no longer treated as a click-through overlay.',
    '**Change icon.** An icon from the site\'s own icon set (an SVG sprite, `<use href="#…">`) gets a "Change icon" button showing the site\'s icons; a pick swaps only that icon, keeping its colour and size.',
    '**Gradient text shows a cursor while editing.** Text painted with a gradient (`background-clip: text`) is transparent, so the typing cursor was invisible; the editor now gives it the colour of the text around it.'] },
  { date: '2026-11-14', time: '13:50', hash: '43ea30f', title: 'Size tokens, image Size, icon controls, AI-only Add page', tags: ['Design', 'Editor', 'AI'], items: [
    '**Sizes become design tokens by themselves.** When a site is published or changed, a raw size that is exactly a design size (`padding: 16px` when the medium gap is 16px) is written as that design size, so a later design change reaches it. Anything else stays as written; the page looks the same.',
    '**Image Size in the toolbar.** Width: Small, Medium, Large, Full or a number of pixels. Height: Auto (the picture\'s own shape) or Fixed (cropped to fit, never squashed). Reset goes back to the page\'s size.',
    '**SVG icons in the toolbar.** Replace opens the Media picker and puts the new image in the icon\'s place, at the size the icon showed at. One-colour icons get a colour swatch: one click recolours them from the site\'s colours. Logos with several colours can only be replaced.',
    '**The Add a section card stays inside the page** (it used to grow past the bottom when its ideas loaded) and can be dragged by its title.',
    '**New pages are made with AI only.** The Add page dialog asks what the page should be, its name and whether it goes in the navigation. The blank and legal-page options are gone.'] },
  { date: '2026-11-14', time: '12:34', hash: '94f961e', title: 'Pin library versions automatically', tags: ['Publishing'], items: [
    'Links to code libraries on a CDN without an exact version (`gsap@3`, `swiper`) are pinned to the exact version the CDN serves today (`gsap@3.15.1`), so a live site never changes or breaks when a library releases a new version.',
    'Happens on publish and on every AI change. Never blocks: if the CDN does not answer, the link stays.',
    'Tests never reach the internet.'] },
  { date: '2026-11-14', time: '12:28', hash: 'f01fa9b', title: 'The server fills in the basics itself', tags: ['Publishing'], items: [
    'A missing `charset` is added.',
    'A missing page language is read from the page\'s own writing (Bangla → `bn`, Arabic → `ar`, and so on; English letters → `en`).',
    'Images get their width and height from the real image (so the page does not jump while loading), only where the site\'s CSS keeps images in shape.',
    'The "image has no width and height" warning is gone: nobody has to fix it by hand.'] },
  { date: '2026-11-14', time: '12:13', hash: '896c571', title: 'Phone numbers and emails are checked', tags: ['AI', 'Publishing'], items: [
    'A phone number or email on a page must be the customer\'s own, or a clearly fake placeholder (`017 00000000`, `example@gmail.com`) that is kept so they see where theirs goes. Publishing warns about placeholders and never blocks.',
    'A real-looking phone or email that nobody gave is refused, so the AI can never invent contact details.',
    'The AI tools have a new `facts` input for the customer\'s own details.',
    'The project rule (CLAUDE.md rule 4) now allows clearly fake placeholders.'] },
  { date: '2026-11-14', time: '11:55', hash: '17118c9', title: 'Gradients stay as the page had them', tags: ['Design'], items: [
    'Saving a gradient again in the Design popup keeps see-through colours, `transparent`, corner directions and round shapes. Before, some colours were dropped and directions changed.',
    'A colour that is not a design colour takes the closest one, marked "(closest)".',
    'Layered, conic and repeating gradients are shown and never rewritten, with a "Replace with a simple gradient" button.'] },
  { date: '2026-11-14', time: '11:46', hash: '2820a60', title: 'Editing text keeps everything around it', tags: ['Editor'], items: [
    'Text next to an icon, or with small tags inside (`small`, `sup`, `mark`, `code`, `abbr`, `time`…), can now be edited. Before, such text could not be edited at all.',
    'When only words change, only those words are saved: links keep "open in new tab", sample marks stay, and rotating-word markers are no longer lost.',
    'New engine command `setTexts` does this.'] },
  { date: '2026-11-14', time: '11:35', hash: 'fea4268', title: 'Staging merged in', tags: ['Maintenance'], items: [
    'Brought in the latest `staging` (a docs update on which staging settings are secrets).'] },
  { date: '2026-11-14', time: '11:31', hash: '80af727', title: 'A test bench for "the site you send is the site you get"', tags: ['Tests'], items: [
    'New fidelity suite: test sites with one hard case each go through publish, live, open in the editor, reach every text, and one edit. It runs with the normal tests and needs no AI. It found 33 problems, all fixed in the pushes above.',
    'New rules audit (`docs/harness_rules_audit.md`): every rule the AI is told, whether code enforces it, and whether it is tested.',
    'The Publish button\'s text is white.'] },
  { date: '2026-11-12', time: '23:20', hash: '440eb8f', title: 'Editor: hidden content, forms, markers and a Save button', tags: ['Editor', 'Forms'], items: [
    'Content shown one at a time can be edited: rotating words, hover and flip cards, toggles, typewriter words, price variants and the page\'s own switch buttons.',
    'Forms: one Field panel for every kind of field (choices, limits, form name); pill words edit in place; no browser autofill while editing.',
    'AI-written pages mark what is shown one at a time (edit markers); publishing checks them.',
    'A coverage check lists text the editor cannot reach, with an Ask AI button.',
    'A Save button replaces autosave (with a green tick when saved, and ⌘S); leaving asks Save / Don\'t save / Cancel; Preview shows unsaved changes.',
    'The light/dark switch moved to the bottom of the left rail; the toolbar stays inside the canvas.'] },
  { date: '2026-11-11', time: '18:33', hash: '69478fd', title: 'Phone menu fix', tags: ['Fixes'], items: [
    'The header\'s menu button opens the menu itself ("Show menu"), and only in phone or tablet view where the menu is hidden.'] },
  { date: '2026-11-11', time: '16:07', hash: '68d7836', title: 'Agent builder: page scripts, forms, copy and paste', tags: ['Editor', 'AI', 'Forms'], items: [
    'Preview runs the page\'s own scripts and opens fast; Edit keeps what Preview showed (a slide, an open answer).',
    'Tabs, sliders, accordions, pop-ups and tooltips can be switched on the canvas.',
    'Switching pages no longer reloads the builder; only the canvas shows a loader.',
    'First Field panel for form fields; Custom CSS shows the rules that style an element.',
    'Add section ideas come from reading the page and never repeat a section it already has.',
    'The chat carries out clear requests; a missing colour is added to the design system.',
    'Copy, Paste and Duplicate (⌘C, ⌘V, ⌘D) keep an element\'s design, across pages.'] },
];
const FIRST = { hash: '115ba28', date: '2026-11-10', title: 'The agent builder as the only editor' };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const ic = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON = {
  ruler: ic('<path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>'), image: ic('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>'),
  shape: ic('<circle cx="8" cy="8" r="4"/><path d="M14 13h7v7h-7z"/>'), plus: ic('<path d="M12 5v14M5 12h14"/>'), spark: ic('<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>'),
  copy: ic('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'), check: ic('<path d="m5 12 4.5 4.5L19 7"/>'),
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const state = { tag: 'All', q: '' };
// turn `code` into <code>, keep our own <b>, and highlight the search
function fmt(text, rich) {
  let s = rich ? text : esc(text);
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${rich ? esc(c) : c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  if (state.q) { const re = new RegExp('(' + state.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi'); s = s.replace(re, '<mark>$1</mark>'); }
  return s;
}
const plain = s => s.replace(/<[^>]+>/g, '').replace(/`|\*\*/g, '').toLowerCase();
const tagsHTML = t => t.map(x => `<span class="tag"><i style="background:${TAGS[x]}"></i>${x}</span>`).join('');
const dayName = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- render ---------- */
function render() {
  const q = state.q.toLowerCase();
  const okTag = t => state.tag === 'All' || t.includes(state.tag);
  const wItems = WAITING.items.filter(i => okTag(i.tags) && (!q || plain(i.html).includes(q)));
  const pushes = PUSHES.filter(p => okTag(p.tags) && (!q || plain(p.title + ' ' + (p.intro || '') + ' ' + p.items.join(' ')).includes(q)));
  const days = [...new Set(pushes.map(p => p.date))];

  let html = '';
  const noneWaiting = !WAITING.items.length;
  if (noneWaiting && state.tag === 'All' && !q) html += `<section class="wait done" id="waiting"><div class="wh"><h2>Not pushed yet</h2><span class="badge ok">${ICON.check}Everything is pushed</span></div><p>${WAITING.note}</p></section>`;
  else if (wItems.length) html += `<section class="wait" id="waiting"><div class="wh"><h2>Not pushed yet</h2><span class="badge amber"><span class="pulse"></span>Waiting for the next push</span></div>
    <p>${WAITING.note}</p><ul class="items">${wItems.map(i => `<li><span class="ix">${ICON[i.icon]}</span><div>${fmt(i.html, true)}<div class="tg">${tagsHTML(i.tags)}</div></div></li>`).join('')}</ul></section>`;
  html += days.map(d => { const list = pushes.filter(p => p.date === d);
    return `<section class="day" id="d-${d}"><h2>${dayName(d)} <span>${list.length} push${list.length > 1 ? 'es' : ''}</span></h2><div class="tl">${list.map(p => `
      <article class="entry ${p.items.length === 1 ? 'small' : ''}" id="c-${p.hash}">
        <div class="meta"><time datetime="${p.date}T${p.time}">${p.time}</time><button class="hash" data-hash="${p.hash}" title="Copy commit hash">${p.hash}${ICON.copy}</button><span class="tg">${tagsHTML(p.tags)}</span></div>
        <h3>${fmt(p.title)}</h3>${p.intro ? `<p class="intro">${fmt(p.intro)}</p>` : ''}<ul>${p.items.map(i => `<li>${fmt(i)}</li>`).join('')}</ul></article>`).join('')}</div></section>`; }).join('');
  if (!wItems.length && !pushes.length) html += `<div class="none">No changes match${state.q ? ` “${esc(state.q)}”` : ''}${state.tag !== 'All' ? ` in ${state.tag}` : ''}.</div>`;
  if (state.tag === 'All' && !q) html += `<div class="first"><span class="hash">${FIRST.hash}</span><span><b>First push</b> · ${dayName(FIRST.date)} · ${FIRST.title}. Everything above came after it.</span></div>`;
  $('#out').innerHTML = html;

  // jump-to menu
  $('#toc').innerHTML = (wItems.length ? `<a href="#waiting" class="wait"><i></i>Not pushed yet<span class="n">${wItems.length}</span></a>` : (noneWaiting && state.tag === 'All' && !q ? `<a href="#waiting" class="clear"><i></i>Not pushed yet<span class="n">0</span></a>` : ''))
    + days.map(d => `<a href="#d-${d}"><i></i>${new Date(d + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}<span class="n">${pushes.filter(p => p.date === d).length}</span></a>`).join('');
  spy();
}
function chips() {
  const count = t => PUSHES.filter(p => p.tags.includes(t)).length + WAITING.items.filter(i => i.tags.includes(t)).length;
  $('#chips').innerHTML = ['All', ...Object.keys(TAGS)].map(t => `<button class="chip ${state.tag === t ? 'on' : ''}" data-tag="${t}">${t === 'All' ? '' : `<i style="background:${TAGS[t]}"></i>`}${t}${t === 'All' ? '' : ` <span style="opacity:.6">${count(t)}</span>`}</button>`).join('');
}
$('#stats').innerHTML = `<div><b>${PUSHES.length}</b>Pushes</div><div><b>${WAITING.items.length}</b>Waiting to push</div><div><b>${PUSHES.reduce((a, p) => a + p.items.length, 0)}</b>Changes</div><div><b>${new Set(PUSHES.map(p => p.date)).size} days</b>${(() => { const ds = PUSHES.map(p => p.date).sort(), f = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); return f(ds[0]) + ' to ' + f(ds[ds.length - 1]); })()}</div>`;

/* highlight the current day in the jump-to menu */
let io;
function spy() {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-90px 0px -65% 0px' });
  document.querySelectorAll('#out > section').forEach(s => io.observe(s));
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-tag]'); if (c) { state.tag = c.dataset.tag; chips(); return render(); }
  const h = e.target.closest('[data-hash]'); if (h) { navigator.clipboard?.writeText(h.dataset.hash); return toast(`Copied ${h.dataset.hash}`); }
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
chips(); render();
</script>
</body>
</html>
